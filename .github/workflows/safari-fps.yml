name: Measure fixture in iPhone Simulator Safari
on:
  push:
    branches: [codex/safari-fps-20260925]
    paths: ['scripts/**', '.github/safari-fps/**', '.github/workflows/safari-fps.yml']
permissions: {contents: read, actions: read}
concurrency: {group: safari-fps, cancel-in-progress: true}
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        timeout-minutes: 8
        with:
          persist-credentials: false
          sparse-checkout: |
            .github/fixed-light-study
            scripts
            docs/unchanged-files.json
            docs/qa-extraction.json
            tools
      - uses: actions/download-artifact@v4
        with:
          name: native-light-dev15-9-candidate
          run-id: 36043919958
          github-token: ${{ github.token }}
          path: '${{ runner.temp }}/original'
      - name: Matching engine
        run: |
          curl -L --fail --retry 2 https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip -o "$RUNNER_TEMP/godot.zip"
          unzip -q "$RUNNER_TEMP/godot.zip" -d "$RUNNER_TEMP/godot"
          echo "$RUNNER_TEMP/godot" >> "$GITHUB_PATH"
      - name: Preserve original resources and append QA scripts
        run: python3 .github/fixed-light-study/patch_pack.py "$RUNNER_TEMP/original" "$RUNNER_TEMP/study"
      - name: Exported input and touch
        run: python3 tools/qa.py --godot Godot_v4.7.2-stable_linux.x86_64 --pack "$RUNNER_TEMP/study/candidate/index.pck" --cases input touch build-flavor --output "$RUNNER_TEMP/study/core"
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: safari-fps-candidate, path: '${{ runner.temp }}/study/candidate', retention-days: 90}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: safari-fps-build
          path: |
            ${{ runner.temp }}/study/*.json
            ${{ runner.temp }}/study/*.log
            ${{ runner.temp }}/study/core
          retention-days: 90
  safari:
    needs: build
    runs-on: macos-15
    timeout-minutes: 25
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.2.app/Contents/Developer
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: .github/safari-fps
      - uses: actions/download-artifact@v4
        with: {name: safari-fps-candidate, path: '${{ runner.temp }}/candidate'}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Prepare native XCTest route
        working-directory: .github/safari-fps
        run: |
          xcodebuild -version
          xcrun simctl list runtimes
          npm init --yes
          npm install --no-audit --no-fund --save-exact appium@3.7.0
          npx --no-install appium driver install xcuitest@12.12.3
          npx --no-install appium driver run xcuitest download-wda -- --outdir="$RUNNER_TEMP/wda" --kind=sim --platform=ios
      - name: Open local fixture and measure actual Safari app
        working-directory: .github/safari-fps
        run: WDA_APP="$RUNNER_TEMP/wda/WebDriverAgentRunner-Runner.app" node safari.mjs "$RUNNER_TEMP/candidate" "$RUNNER_TEMP/safari-fps"
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: safari-fps-evidence, path: '${{ runner.temp }}/safari-fps', retention-days: 90}
