name: Verify final DEV15.11 candidate
on:
  push:
    branches: [codex/music-dev15-11-20260927]
    paths: ['scripts/**', '.github/music-release/**', '.github/workflows/integrated-candidate.yml']
permissions: {contents: read, actions: read}
concurrency: {group: music-dev15-11, cancel-in-progress: true}
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        timeout-minutes: 8
        with:
          persist-credentials: false
          sparse-checkout: |
            .github/music-release
            scripts
            docs/unchanged-files.json
            docs/qa-extraction.json
            tools
      - uses: actions/download-artifact@v4
        with:
          name: integrated-candidate
          run-id: 36118561266
          github-token: ${{ github.token }}
          path: '${{ runner.temp }}/original'
      - name: Matching engine
        run: |
          curl -L --fail --retry 2 https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip -o "$RUNNER_TEMP/godot.zip"
          unzip -q "$RUNNER_TEMP/godot.zip" -d "$RUNNER_TEMP/godot"
          echo "$RUNNER_TEMP/godot" >> "$GITHUB_PATH"
      - name: Preserve original resources and append QA scripts
        run: python3 .github/music-release/build.py "$RUNNER_TEMP/original" "$RUNNER_TEMP/study/candidate"
      - name: Exported input and touch
        run: python3 tools/qa.py --godot Godot_v4.7.2-stable_linux.x86_64 --pack "$RUNNER_TEMP/study/candidate/index.pck" --cases input touch build-flavor crusher mole-autonomy one-point-zero-world --output "$RUNNER_TEMP/study/core"
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: music-candidate, path: '${{ runner.temp }}/study/candidate', retention-days: 90}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: music-build
          path: |
            ${{ runner.temp }}/study/*.json
            ${{ runner.temp }}/study/*.log
            ${{ runner.temp }}/study/core
          retention-days: 90
  browser:
    needs: build
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: .github/music-release
      - uses: actions/download-artifact@v4
        with: {name: music-candidate, path: '${{ runner.temp }}/candidate'}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: npm ci --ignore-scripts && npm install --no-save --package-lock=false pngjs && npx playwright install webkit
      - name: Ordinary WebKit startup and save
        env: {EXPECTED_VERSION: 1.0.0-dev.15.11, CANDIDATE_SOURCE: '${{ github.sha }}'}
        run: node .github/music-release/startup.mjs "$RUNNER_TEMP/candidate" "$RUNNER_TEMP/startup"
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: music-startup, path: '${{ runner.temp }}/startup', retention-days: 90}

