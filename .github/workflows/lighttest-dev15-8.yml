name: Verify depth-one labelled light test DEV15.8
on:
  push:
    branches: [codex/lighttest-dev15-8-20260924]
    paths: ['scripts/**', 'tools/session-reports-browser.js', '.github/lighttest-dev15-8/**', '.github/workflows/lighttest-dev15-8.yml']
permissions:
  contents: read
concurrency:
  group: telemetry-dev15-8-qa
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Install matching engine
        run: |
          curl -L --fail --retry 2 https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip -o "$RUNNER_TEMP/godot.zip"
          unzip -q "$RUNNER_TEMP/godot.zip" -d "$RUNNER_TEMP/godot"
          echo "$RUNNER_TEMP/godot" >> "$GITHUB_PATH"
      - name: Build exact candidate
        run: python3 .github/lighttest-dev15-8/build.py Godot_v4.7.2-stable_linux.x86_64 "$RUNNER_TEMP/dev15-8"
      - name: Protected differences
        continue-on-error: true
        run: python3 tools/check_invariants.py > "$RUNNER_TEMP/dev15-8/invariants.log" 2>&1
      - name: Exported input, touch, developer tools and flavor
        run: python3 tools/qa.py --godot Godot_v4.7.2-stable_linux.x86_64 --pack "$RUNNER_TEMP/dev15-8/candidate/index.pck" --cases input touch dev-tools build-flavor --output "$RUNNER_TEMP/dev15-8/core"
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: dev15-8-candidate, path: '${{ runner.temp }}/dev15-8/candidate', retention-days: 90}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dev15-8-build-review
          path: |
            ${{ runner.temp }}/dev15-8/*.json
            ${{ runner.temp }}/dev15-8/*.log
            ${{ runner.temp }}/dev15-8/core
          retention-days: 90
  browser:
    needs: build
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/download-artifact@v4
        with: {name: dev15-8-candidate, path: '${{ runner.temp }}/candidate'}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: npm ci --ignore-scripts && npx playwright install chromium webkit
      - name: Actual gameplay recording and private transfer contract
        run: node .github/lighttest-dev15-8/reports.mjs "$RUNNER_TEMP/candidate" "$RUNNER_TEMP/dev15-8-browser"
      - name: Apple WebKit report transfer
        env: {REPORT_BROWSER: webkit}
        run: node .github/lighttest-dev15-8/reports.mjs "$RUNNER_TEMP/candidate" "$RUNNER_TEMP/dev15-8-report-webkit"
      - name: Full real-time Emberdeep light test and labelled report
        run: node .github/lighttest-dev15-8/review.mjs "$RUNNER_TEMP/candidate" "$RUNNER_TEMP/dev15-8-light"
      - name: Apple WebKit light transitions and recovery
        env: {REPORT_BROWSER: webkit}
        run: node .github/lighttest-dev15-8/review.mjs "$RUNNER_TEMP/candidate" "$RUNNER_TEMP/dev15-8-light-webkit"
      - name: Ordinary Apple WebKit startup and save
        env: {EXPECTED_VERSION: 1.0.0-dev.15.8, CANDIDATE_SOURCE: '${{ github.sha }}'}
        run: node .github/dev14-startup/inspect.mjs "$RUNNER_TEMP/candidate" "$RUNNER_TEMP/dev15-8-webkit"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dev15-8-browser-review
          path: |
            ${{ runner.temp }}/dev15-8-browser
            ${{ runner.temp }}/dev15-8-webkit
            ${{ runner.temp }}/dev15-8-report-webkit
            ${{ runner.temp }}/dev15-8-light
            ${{ runner.temp }}/dev15-8-light-webkit
          retention-days: 90
