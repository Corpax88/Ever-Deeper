name: Compare depth-one floor lighting candidate
on:
  push:
    branches: [codex/floor-lighting-dev15-8-20260924]
    paths: ['.github/floor-dev15-8/build.py', '.github/fps-dev15-6/native-input.json', '.github/fps-dev15-6/shell-input.json', 'scripts/**', 'assets/ui/skills/**', 'assets/ui/fonts/EBGaramond.ttf', '.github/floor-dev15-8/**', 'shaders/**', '.github/workflows/floor-study.yml']
permissions:
  contents: read
concurrency:
  group: fps-floor-study-qa
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install matching engine
        run: |
          curl -L --fail --retry 2 https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip -o "$RUNNER_TEMP/godot.zip"
          unzip -q "$RUNNER_TEMP/godot.zip" -d "$RUNNER_TEMP/godot"
          echo "$RUNNER_TEMP/godot" >> "$GITHUB_PATH"
      - name: Export exact candidate
        run: python3 .github/floor-dev15-8/build.py Godot_v4.7.2-stable_linux.x86_64 "$RUNNER_TEMP/floor-study"
      - name: Record protected-file differences
        continue-on-error: true
        run: python3 tools/check_invariants.py > "$RUNNER_TEMP/floor-study/invariants.log" 2>&1
      - name: Check actual exported gameplay, input, touch and save behavior
        run: |
          python3 tools/qa.py --godot Godot_v4.7.2-stable_linux.x86_64 --pack "$RUNNER_TEMP/floor-study/candidate/index.pck" --cases input overhaul touch layout build-flavor --output "$RUNNER_TEMP/floor-study/core"
          mkdir -p "$RUNNER_TEMP/skills-isolated"
          cd "$RUNNER_TEMP/skills-isolated"
          Godot_v4.7.2-stable_linux.x86_64 --headless --path . --main-pack "$RUNNER_TEMP/floor-study/candidate/index.pck" -- --qa-miner-skills > "$RUNNER_TEMP/floor-study/skills-core.log" 2>&1
          python3 -c 'import os,pathlib; s=(pathlib.Path(os.environ["RUNNER_TEMP"])/"floor-study/skills-core.log").read_text(); assert "MINER_SKILLS_COMPLETE" in s and "ERROR" not in s'
          python3 "$GITHUB_WORKSPACE/.github/fps-dev15-6/finalize-build.py" "$RUNNER_TEMP/floor-study"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: floor-study-candidate
          path: ${{ runner.temp }}/floor-study/candidate
          if-no-files-found: error
          retention-days: 90
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: floor-study-build-review
          path: |
            ${{ runner.temp }}/floor-study/*.json
            ${{ runner.temp }}/floor-study/*.log
            ${{ runner.temp }}/floor-study/core
          if-no-files-found: error
          retention-days: 90
  browser:
    needs: build
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: floor-study-candidate
          path: ${{ runner.temp }}/candidate
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts && npx playwright install chromium webkit
      - name: Actual mining, terrain parity and A/B/A CPU review
        run: node .github/floor-dev15-8/review.mjs "$RUNNER_TEMP/candidate" "$RUNNER_TEMP/floor-study-browser"
      - name: Ordinary Apple WebKit new and saved games
        env:
          EXPECTED_VERSION: 1.0.0-dev.15.7
          CANDIDATE_SOURCE: ${{ github.sha }}
        run: node .github/dev14-startup/inspect.mjs "$RUNNER_TEMP/candidate" "$RUNNER_TEMP/floor-study-webkit"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: floor-study-browser-review
          path: |
            ${{ runner.temp }}/floor-study-browser
            ${{ runner.temp }}/floor-study-webkit
          if-no-files-found: error
          retention-days: 90
