name: Validate immutable DEV14.3 without recording overhead
on:
  push:
    branches: [codex/dev143-render-validation-20260922]
    paths: ['.github/dev14/review.mjs', '.github/dev14/reuse-export.py', '.github/workflows/dev14-rereview.yml']
permissions:
  contents: read
  actions: read
concurrency:
  group: dev143-immutable-review
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          artifact-ids: 10683499608
          merge-multiple: true
          run-id: 35704702742
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: ${{ runner.temp }}/candidate
      - uses: actions/download-artifact@v4
        with:
          artifact-ids: 10684320280
          merge-multiple: true
          run-id: 35704702742
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: ${{ runner.temp }}/build-review
      - name: Verify original build, immutable package and validation-only changes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 .github/dev14/reuse-export.py "$RUNNER_TEMP/candidate" "$RUNNER_TEMP/build-review"
      - uses: actions/upload-artifact@v4
        with:
          name: dev14-candidate
          path: ${{ runner.temp }}/candidate
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-artifact@v4
        with:
          name: dev14-build-review
          path: ${{ runner.temp }}/build-review
          if-no-files-found: error
          retention-days: 30
  browser:
    needs: build
    runs-on: macos-15
    timeout-minutes: 25
    env:
      CANDIDATE_SOURCE: 1632526b0cb675e5efd5709b0e55a6ab7ef970d9
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: dev14-candidate
          path: ${{ runner.temp }}/candidate
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts && npx playwright install chromium webkit
      - name: Review all eight pickaxes and unchanged 50 FPS gate without video encoding
        run: node .github/dev14/review.mjs "$RUNNER_TEMP/candidate" "$RUNNER_TEMP/dev14-browser"
      - name: Check ordinary Apple WebKit New Game and saved-run confirmation
        env:
          EXPECTED_VERSION: 1.0.0-dev.14.3
        run: node .github/dev14-startup/inspect.mjs "$RUNNER_TEMP/candidate" "$RUNNER_TEMP/dev14-startup"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dev14-browser-review
          path: ${{ runner.temp }}/dev14-browser
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dev14-webkit-startup-fixed
          path: ${{ runner.temp }}/dev14-startup
          if-no-files-found: error
          retention-days: 30
