name: Diagnose sustained Mossvein frame drop
on:
  push:
    branches: [codex-mossvein-diagnosis]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install renderer
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y xvfb libgl1-mesa-dri
          curl -L --fail --retry 3 https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip -o "$RUNNER_TEMP/godot.zip"
          unzip -q "$RUNNER_TEMP/godot.zip" -d "$RUNNER_TEMP/godot"
          echo "$RUNNER_TEMP/godot" >> "$GITHUB_PATH"
      - name: Import and probe with real rendering
        run: |
          mkdir -p "$RUNNER_TEMP/probe" "$RUNNER_TEMP/probe-saves"
          Godot_v4.7.2-stable_linux.x86_64 --headless --editor --path . --import > "$RUNNER_TEMP/probe/import.log" 2>&1
          if rg 'SCRIPT ERROR|Parse Error|^ERROR:' "$RUNNER_TEMP/probe/import.log"; then exit 1; fi
          XDG_DATA_HOME="$RUNNER_TEMP/probe-saves" xvfb-run -a Godot_v4.7.2-stable_linux.x86_64 --path . --resolution 844x390 --audio-driver Dummy -- --qa-mobile-performance --perf-mossvein --perf-output="$RUNNER_TEMP/probe" > "$RUNNER_TEMP/probe/run.log" 2>&1
          cat "$RUNNER_TEMP/probe/run.log"
          if rg 'SCRIPT ERROR|Parse Error|^ERROR:' "$RUNNER_TEMP/probe/run.log"; then exit 1; fi
          rg MOSSVEIN_PROBE_COMPLETE "$RUNNER_TEMP/probe/run.log"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mossvein-diagnosis
          path: ${{ runner.temp }}/probe
          retention-days: 30
