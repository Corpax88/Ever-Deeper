name: Restore Mossvein art workspace
on:
  push:
    branches: [codex/mossvein-painted-20261114]
    paths: ['.github/workflows/mossvein-painted-restore.yml']
permissions: {contents: read}
concurrency: {group: mossvein-painted-restore, cancel-in-progress: true}
jobs:
  restore:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Package exact source and matching Linux engine
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/restore/source" "$RUNNER_TEMP/parts"
          git archive HEAD | tar -x -C "$RUNNER_TEMP/restore/source"
          curl -L --fail --retry 2 https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip -o "$RUNNER_TEMP/restore/godot.zip"
          printf '%s\n' "$GITHUB_SHA" > "$RUNNER_TEMP/restore/SOURCE_REVISION"
          tar -czf "$RUNNER_TEMP/restore.tar.gz" -C "$RUNNER_TEMP/restore" .
          split -d -b 24000000 "$RUNNER_TEMP/restore.tar.gz" "$RUNNER_TEMP/parts/source.part"
          sha256sum "$RUNNER_TEMP/restore.tar.gz" "$RUNNER_TEMP/parts/"* > "$RUNNER_TEMP/parts/SHA256SUMS"
      - uses: actions/upload-artifact@v4
        with: {name: mossvein-source-manifest, path: '${{ runner.temp }}/parts/SHA256SUMS', retention-days: 14}
      - uses: actions/upload-artifact@v4
        with: {name: mossvein-source-00, path: '${{ runner.temp }}/parts/source.part00', if-no-files-found: ignore, compression-level: 0, retention-days: 14}
      - uses: actions/upload-artifact@v4
        with: {name: mossvein-source-01, path: '${{ runner.temp }}/parts/source.part01', if-no-files-found: ignore, compression-level: 0, retention-days: 14}
      - uses: actions/upload-artifact@v4
        with: {name: mossvein-source-02, path: '${{ runner.temp }}/parts/source.part02', if-no-files-found: ignore, compression-level: 0, retention-days: 14}
      - uses: actions/upload-artifact@v4
        with: {name: mossvein-source-03, path: '${{ runner.temp }}/parts/source.part03', if-no-files-found: ignore, compression-level: 0, retention-days: 14}
      - uses: actions/upload-artifact@v4
