name: Isolate remaining published DEV6 lighting cost
on:
  push:
    branches: [codex-dev6-cost]
    paths: ['tools/probe-dev6-cost.gd', '.github/workflows/dev6-cost.yml']
permissions:
  contents: read
  actions: read
jobs:
  rendered:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        area: [hub, mossvein]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: dev-lighting-candidate
          run-id: 34256408421
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/candidate
      - name: Install matching native renderer
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y xvfb libgl1-mesa-dri ripgrep
          curl -L --fail --retry 3 --retry-all-errors https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip -o "$RUNNER_TEMP/godot.zip"
          unzip -q "$RUNNER_TEMP/godot.zip" -d "$RUNNER_TEMP/godot"
          echo "$RUNNER_TEMP/godot" >> "$GITHUB_PATH"
      - name: Verify reviewed package identity
        run: |
          python3 - <<'PYCODE'
          import os,json,hashlib
          from pathlib import Path
          p=Path(os.environ['RUNNER_TEMP'])/'candidate'
          files=json.loads((p/'manifest.json').read_text())
          for name,info in files.items():
              data=(p/name).read_bytes()
              assert len(data)==info['size'] and hashlib.sha256(data).hexdigest()==info['sha256'],name
          PYCODE
      - name: Measure floor, sections, lights and chunk size in the exact package
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: |
          mkdir -p "$RUNNER_TEMP/review" "$RUNNER_TEMP/pack-run"
          cp tools/probe-dev6-cost.gd "$RUNNER_TEMP/probe-dev6-cost.gd"
          cd "$RUNNER_TEMP/pack-run"
          xvfb-run -a -s '-screen 0 2560x1440x24' timeout 480 Godot_v4.7.2-stable_linux.x86_64 --path . --main-pack "$RUNNER_TEMP/candidate/index.pck" --script "$RUNNER_TEMP/probe-dev6-cost.gd" --resolution 2328x1260 --audio-driver Dummy -- --output="$RUNNER_TEMP/review" --area='${{ matrix.area }}' > "$RUNNER_TEMP/review/native.log" 2>&1
          if rg 'SCRIPT ERROR|Parse Error|^ERROR:' "$RUNNER_TEMP/review/native.log"; then exit 1; fi
          rg DEV6_COST_OK "$RUNNER_TEMP/review/native.log"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dev6-cost-${{ matrix.area }}
          path: ${{ runner.temp }}/review
          retention-days: 30
