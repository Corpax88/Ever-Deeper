name: Cache xdelta3 helper

on:
  push:
    paths:
      - .github/workflows/cache-xdelta3-temp.yml

permissions:
  contents: read

jobs:
  cache:
    runs-on: ubuntu-latest
    steps:
      - name: Install xdelta3
        run: |
          sudo apt-get update
          sudo apt-get install --yes xdelta3
          mkdir -p artifact
          cp "$(command -v xdelta3)" artifact/xdelta3
          chmod 0755 artifact/xdelta3
          sha256sum artifact/xdelta3 > artifact/SHA256SUMS
          ldd artifact/xdelta3

      - name: Upload xdelta3
        uses: actions/upload-artifact@v4
        with:
          name: xdelta3-linux-amd64
          path: artifact/
          retention-days: 1
          if-no-files-found: error
