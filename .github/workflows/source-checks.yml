name: Godot source checks
on:
  push:
    branches: [main]
    paths: ['scripts/**', 'scenes/**', 'shaders/**', 'assets/**', 'data/**', 'project.godot', 'export_presets.cfg', 'tools/qa.py', 'tools/check_invariants.py', 'docs/unchanged-files.json', 'docs/qa-extraction.json', '.github/workflows/source-checks.yml']
  pull_request:
    paths: ['scripts/**', 'scenes/**', 'shaders/**', 'assets/**', 'data/**', 'project.godot', 'export_presets.cfg', 'tools/qa.py', 'tools/check_invariants.py', 'docs/unchanged-files.json', 'docs/qa-extraction.json', '.github/workflows/source-checks.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  core:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Install Godot 4.7.2
        run: |
          curl -L --fail --retry 3 https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip -o "$RUNNER_TEMP/godot.zip"
          unzip -q "$RUNNER_TEMP/godot.zip" -d "$RUNNER_TEMP/godot"
          echo "$RUNNER_TEMP/godot" >> "$GITHUB_PATH"
      - name: Import the tested commit and check current source
        run: |
          Godot_v4.7.2-stable_linux.x86_64 --headless --editor --path . --import > "$RUNNER_TEMP/import.log" 2>&1
          python3 - <<'PY'
          import os, re
          from pathlib import Path
          log = (Path(os.environ['RUNNER_TEMP']) / 'import.log').read_text(errors='replace')
          if re.search(r'SCRIPT ERROR|Parse Error|^ERROR:', log, re.M):
              raise SystemExit('Godot import failed; see the attached import.log')
          PY
          python3 tools/check_invariants.py
          python3 tools/qa.py --godot Godot_v4.7.2-stable_linux.x86_64 --output "$RUNNER_TEMP/native"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: source-check-results
          path: |
            ${{ runner.temp }}/import.log
            ${{ runner.temp }}/native
