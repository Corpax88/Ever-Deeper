name: Validate DEV9 cached fixed lighting
on:
  push:
    branches: [codex-fixed-lighting-dev9]
    paths: ['scripts/**', 'shaders/**', 'export_presets.cfg', 'tools/render-probe*', 'tools/install-render-probe-shell.py', 'docs/unchanged-files.json', '.github/workflows/dev-lighting.yml']
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install matching Godot and export templates
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ripgrep
          curl -L --fail --retry 3 --retry-all-errors https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip -o "$RUNNER_TEMP/godot.zip"
          unzip -q "$RUNNER_TEMP/godot.zip" -d "$RUNNER_TEMP/godot"
          echo "$RUNNER_TEMP/godot" >> "$GITHUB_PATH"
          curl -L --fail --retry 3 --retry-all-errors https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_export_templates.tpz -o "$RUNNER_TEMP/templates.tpz"
          unzip -q "$RUNNER_TEMP/templates.tpz" 'templates/web*.zip' 'templates/version.txt' -d "$RUNNER_TEMP/templates"
          mkdir -p "$HOME/.local/share/godot/export_templates/4.7.2.stable"
          cp "$RUNNER_TEMP/templates/templates/"* "$HOME/.local/share/godot/export_templates/4.7.2.stable/"
      - name: Import, verify and export both flavors
        run: |
          mkdir -p "$RUNNER_TEMP/candidate" "$RUNNER_TEMP/production" "$RUNNER_TEMP/review"
          Godot_v4.7.2-stable_linux.x86_64 --headless --editor --path . --import > "$RUNNER_TEMP/review/import.log" 2>&1
          if rg 'SCRIPT ERROR|Parse Error|^ERROR:' "$RUNNER_TEMP/review/import.log"; then exit 1; fi
          python3 tools/check_invariants.py
          Godot_v4.7.2-stable_linux.x86_64 --headless --path . --export-release 'Web DEV' "$RUNNER_TEMP/candidate/index.html" > "$RUNNER_TEMP/review/export-dev.log" 2>&1
          Godot_v4.7.2-stable_linux.x86_64 --headless --path . --export-release 'Web Production' "$RUNNER_TEMP/production/index.html" > "$RUNNER_TEMP/review/export-production.log" 2>&1
          if rg 'SCRIPT ERROR|Parse Error|^ERROR:' "$RUNNER_TEMP/review/export-"*.log; then exit 1; fi
          python3 tools/install-render-probe-shell.py "$RUNNER_TEMP/candidate/index.html"
          python3 tools/qa.py --godot Godot_v4.7.2-stable_linux.x86_64 --pack "$RUNNER_TEMP/candidate/index.pck" --output "$RUNNER_TEMP/review/core"
          python3 tools/qa.py --godot Godot_v4.7.2-stable_linux.x86_64 --pack "$RUNNER_TEMP/candidate/index.pck" --cases build-flavor --output "$RUNNER_TEMP/review/dev-flavor"
          python3 tools/qa.py --godot Godot_v4.7.2-stable_linux.x86_64 --pack "$RUNNER_TEMP/production/index.pck" --cases build-flavor --output "$RUNNER_TEMP/review/production-flavor"
      - name: Bind exact candidate files
        run: |
          python3 - <<'PY'
          import os,json,hashlib
          from pathlib import Path
          root=Path(os.environ['RUNNER_TEMP'])/'candidate'
          names=['index.html','index.js','index.pck','index.wasm','index.audio.position.worklet.js','index.audio.worklet.js','index.png','index.icon.png','index.apple-touch-icon.png']
          files={name:{'size':(root/name).stat().st_size,'sha256':hashlib.sha256((root/name).read_bytes()).hexdigest()} for name in names}
          for file in root.iterdir():
            if file.name not in names: file.unlink()
          (root/'manifest.json').write_text(json.dumps(files,indent=2)+'\n')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: dev-lighting-candidate
          path: ${{ runner.temp }}/candidate
          retention-days: 30
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dev-lighting-build-review
          path: ${{ runner.temp }}/review
          retention-days: 30
  native:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        area: [hub, mossvein, moonglass, emberdeep, starfall, other, preview]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: dev-lighting-candidate
          path: ${{ runner.temp }}/candidate
      - name: Install matching native renderer
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y xvfb libgl1-mesa-dri ripgrep
          curl -L --fail --retry 3 --retry-all-errors https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip -o "$RUNNER_TEMP/godot.zip"
          unzip -q "$RUNNER_TEMP/godot.zip" -d "$RUNNER_TEMP/godot"
          echo "$RUNNER_TEMP/godot" >> "$GITHUB_PATH"
      - name: Exact-package original versus optimized visuals and gameplay
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: |
          mkdir -p "$RUNNER_TEMP/review" "$RUNNER_TEMP/pack-run"
          cd "$RUNNER_TEMP/pack-run"
          if [ '${{ matrix.area }}' = 'preview' ]; then
            REVIEW_FLAG=--perf-review
            REVIEW_MARKER=EVER_DEEPER_MOBILE_REVIEW_COMPLETE
          else
            REVIEW_FLAG=--perf-lighting-release
            REVIEW_MARKER=LIGHTING_RELEASE_REVIEW_OK
          fi
          xvfb-run -a -s '-screen 0 2560x1440x24' timeout 600 Godot_v4.7.2-stable_linux.x86_64 --path . --main-pack "$RUNNER_TEMP/candidate/index.pck" --resolution 2328x1260 --audio-driver Dummy -- --qa-mobile-performance "$REVIEW_FLAG" --probe-area='${{ matrix.area }}' --perf-output="$RUNNER_TEMP/review" > "$RUNNER_TEMP/review/native.log" 2>&1
          if rg 'SCRIPT ERROR|Parse Error|^ERROR:' "$RUNNER_TEMP/review/native.log"; then exit 1; fi
          rg "$REVIEW_MARKER" "$RUNNER_TEMP/review/native.log"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dev-lighting-native-${{ matrix.area }}
          path: ${{ runner.temp }}/review
          retention-days: 30
  chromium:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        area: [hub, mossvein]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: dev-lighting-candidate
          path: ${{ runner.temp }}/candidate
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Chromium DPR3 180-second diagnostic and real touch restoration
        run: |
          npm ci
          npx playwright install --with-deps chromium
          sudo apt-get install -y xvfb libgl1-mesa-dri
          LIBGL_ALWAYS_SOFTWARE=1 xvfb-run -a node tools/render-probe-web.mjs "$RUNNER_TEMP/candidate" "$RUNNER_TEMP/review" '${{ matrix.area }}'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dev-lighting-chromium-${{ matrix.area }}
          path: ${{ runner.temp }}/review
          retention-days: 30

  gates:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: dev-lighting-candidate
          path: ${{ runner.temp }}/candidate
      - name: Install matching native renderer
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y xvfb libgl1-mesa-dri ripgrep
          curl -L --fail --retry 3 --retry-all-errors https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip -o "$RUNNER_TEMP/godot.zip"
          unzip -q "$RUNNER_TEMP/godot.zip" -d "$RUNNER_TEMP/godot"
          echo "$RUNNER_TEMP/godot" >> "$GITHUB_PATH"
      - name: Verify candidate package identity
        run: |
          python3 - <<'PYCODE'
          import os,json,hashlib
          from pathlib import Path
          p=Path(os.environ['RUNNER_TEMP'])/'candidate'
          files=json.loads((p/'manifest.json').read_text())
          for name,info in files.items():
              data=(p/name).read_bytes()
              assert len(data)==info['size'] and hashlib.sha256(data).hexdigest()==info['sha256'],name
          PYCODE
      - name: Render intact and struck gates from the exact candidate
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: |
          mkdir -p "$RUNNER_TEMP/review" "$RUNNER_TEMP/pack-run"
          cp tools/review-lit-gates.gd "$RUNNER_TEMP/review-lit-gates.gd"
          cd "$RUNNER_TEMP/pack-run"
          xvfb-run -a -s '-screen 0 2560x1440x24' timeout 480 Godot_v4.7.2-stable_linux.x86_64 --path . --main-pack "$RUNNER_TEMP/candidate/index.pck" --script "$RUNNER_TEMP/review-lit-gates.gd" --resolution 2328x1260 --audio-driver Dummy -- --output="$RUNNER_TEMP/review" > "$RUNNER_TEMP/review/native.log" 2>&1
          if rg 'SCRIPT ERROR|Parse Error|^ERROR:' "$RUNNER_TEMP/review/native.log"; then exit 1; fi
          rg LIT_GATE_REVIEW_OK "$RUNNER_TEMP/review/native.log"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dev-lighting-native-gates
          path: ${{ runner.temp }}/review
          retention-days: 30
