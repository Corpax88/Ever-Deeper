name: Verify surface light diagnostic
on:
  push:
    branches: [codex/surface-light-probe-20260928]
    paths: ['.github/surface-light-probe/**', '.github/workflows/surface-light-probe.yml']
permissions: {contents: read, actions: read}
concurrency: {group: surface-light-probe, cancel-in-progress: true}
jobs:
  focus:
    runs-on: macos-15
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: |
            scripts
            .github/surface-light-probe
            .github/graphics-settings
      - uses: actions/download-artifact@v4
        with:
          name: skill-level-candidate
          run-id: 36376489306
          github-token: ${{ github.token }}
          path: '${{ runner.temp }}/original'
      - run: python3 .github/surface-light-probe/build.py "$RUNNER_TEMP/original" "$RUNNER_TEMP/focus"
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: npm ci --ignore-scripts && npm install --no-save --package-lock=false pngjs && npx playwright install webkit
      - run: node .github/surface-light-probe/review.mjs "$RUNNER_TEMP/focus" "$RUNNER_TEMP/evidence"
        timeout-minutes: 5
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: surface-probe-evidence, path: '${{ runner.temp }}/evidence', retention-days: 30}

      - uses: actions/upload-artifact@v4
        with: {name: surface-probe-candidate, path: '${{ runner.temp }}/focus', retention-days: 30}
