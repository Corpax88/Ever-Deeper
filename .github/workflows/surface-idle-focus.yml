name: Isolate surface idle rendering
on:
  push:
    branches: [codex/surface-idle-focus-20260928]
    paths: ['.github/surface-idle-focus/**', '.github/workflows/surface-idle-focus.yml']
permissions: {contents: read, actions: read}
concurrency: {group: surface-idle-focus, cancel-in-progress: true}
jobs:
  focus:
    runs-on: macos-15
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: |
            scripts
            .github/surface-idle-focus
            .github/graphics-settings
      - uses: actions/download-artifact@v4
        with:
          name: skill-level-candidate
          run-id: 36376489306
          github-token: ${{ github.token }}
          path: '${{ runner.temp }}/original'
      - run: python3 .github/surface-idle-focus/build.py "$RUNNER_TEMP/original" "$RUNNER_TEMP/focus"
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: npm ci --ignore-scripts && npm install --no-save --package-lock=false pngjs && npx playwright install webkit
      - run: node .github/surface-idle-focus/review.mjs "$RUNNER_TEMP/focus" "$RUNNER_TEMP/evidence"
        timeout-minutes: 3
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: surface-idle-evidence, path: '${{ runner.temp }}/evidence', retention-days: 30}
