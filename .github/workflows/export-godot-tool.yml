name: Export verified Godot tool

on:
  push:
    branches: ["tooling/godot-4-7-2-export"]
    paths: [".github/workflows/export-godot-tool.yml"]

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Download verified Godot 4.7.2
        shell: bash
        run: |
          set -euo pipefail
          curl -L --fail --retry 4 --retry-all-errors \
            https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip \
            -o "$RUNNER_TEMP/godot.zip"
          echo "cadd3204e728a35d3f13adb7fd0d7902636b79f6b95c40c265eb73b6c35329e4  $RUNNER_TEMP/godot.zip" | sha256sum -c -
      - name: Upload verified editor
        uses: actions/upload-artifact@v4
        with:
          name: godot-4.7.2-linux
          path: ${{ runner.temp }}/godot.zip
          compression-level: 0
          retention-days: 1
