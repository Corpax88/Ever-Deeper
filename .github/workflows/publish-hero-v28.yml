name: Publish reviewed DEV8 Gruvepappa v28
on:
  push:
    branches: [main]
    paths: ['.github/workflows/publish-hero-v28.yml']
permissions:
  contents: read
  actions: read
  pages: write
  id-token: write
concurrency:
  group: pages-ever-deeper
  cancel-in-progress: false
jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Require all successful exact-package review checks
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$RUNNER_TEMP/checks"
          gh api repos/Corpax88/Ever-Deeper/actions/runs/34267571804 > "$RUNNER_TEMP/checks/package-run.json"
          gh api repos/Corpax88/Ever-Deeper/actions/runs/34267571804/jobs > "$RUNNER_TEMP/checks/package-jobs.json"
          gh api repos/Corpax88/Ever-Deeper/actions/runs/34268226702 > "$RUNNER_TEMP/checks/environment-run.json"
          gh api repos/Corpax88/Ever-Deeper/actions/runs/34268469537 > "$RUNNER_TEMP/checks/motion-run.json"
          python3 .github/hero-v28/check-reviewed-runs.py "$RUNNER_TEMP/checks"
      - uses: actions/download-artifact@v4
        with:
          name: hero-v28-candidate
          run-id: 34267571804
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/candidate
      - name: Preserve the previous release and stage reviewed files
        run: python3 .github/hero-v28/publish.py prepare "$RUNNER_TEMP/candidate" "$RUNNER_TEMP/site" "$RUNNER_TEMP/rollback"
      - uses: actions/upload-artifact@v4
        with:
          name: ever-deeper-before-dev8-hero-rollback
          path: ${{ runner.temp }}/rollback
          retention-days: 30
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ runner.temp }}/site
  deploy:
    needs: package
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
  verify:
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 .github/hero-v28/publish.py verify
