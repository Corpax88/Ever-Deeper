name: Verify LIVE1.0.5 shared loader Linux fallback
on:
  push:
    branches: [codex/live-1-0-5-20261005]
    paths: ['.github/live-1-0-5/linux-run.json']
permissions: {contents: read, actions: read}
concurrency: {group: live-1-0-5-linux, cancel-in-progress: false}
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/download-artifact@v4
        with:
          artifact-ids: '11316683314'
          merge-multiple: true
          run-id: '37239148524'
          github-token: '${{ github.token }}'
          path: '${{ runner.temp }}/original'
      - uses: actions/download-artifact@v4
        with:
          artifact-ids: '11164614080'
          merge-multiple: true
          run-id: '36867669696'
          github-token: '${{ github.token }}'
          path: '${{ runner.temp }}/legacy'
      - run: python3 .github/live-1-0-5/share-engine.py "$RUNNER_TEMP/original" "$RUNNER_TEMP/candidate"
      - run: |
          curl -L --fail --retry 2 https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip -o "$RUNNER_TEMP/godot.zip"
          unzip -q "$RUNNER_TEMP/godot.zip" -d "$RUNNER_TEMP/godot"
          chmod +x "$RUNNER_TEMP/godot/Godot_v4.7.2-stable_linux.x86_64"
          python3 tools/qa.py --godot "$RUNNER_TEMP/godot/Godot_v4.7.2-stable_linux.x86_64" --pack "$RUNNER_TEMP/candidate/index.pck" --cases input premium-core build-flavor one-point-zero-migration --output "$RUNNER_TEMP/evidence/core"
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: npm ci --ignore-scripts && npx playwright install --with-deps chromium webkit
      - run: node .github/live-1-0-5/review-linux.mjs "$RUNNER_TEMP/candidate" "$RUNNER_TEMP/evidence/browser" "$RUNNER_TEMP/legacy"
      - run: node .github/live-1-0-5/startup-linux.mjs "$RUNNER_TEMP/candidate" "$RUNNER_TEMP/evidence/ordinary"
        env: {EXPECTED_VERSION: '1.0.5', CANDIDATE_SOURCE: '${{ github.sha }}'}
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: live-1-0-5-evidence, path: '${{ runner.temp }}/evidence', retention-days: 30}
      - uses: actions/upload-artifact@v4
        with: {name: live-1-0-5-candidate, path: '${{ runner.temp }}/candidate', retention-days: 30}
