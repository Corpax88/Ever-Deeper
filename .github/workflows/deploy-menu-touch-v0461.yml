name: Publish iPhone menu scrolling to DEV and live
on:
  push:
    branches: [main]
    paths: ['.github/workflows/deploy-menu-touch-v0461.yml']
permissions:
  contents: read
  actions: read
  pages: write
  id-token: write
concurrency:
  group: pages-ever-deeper
  cancel-in-progress: false
jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: touch-exact-candidates
          run-id: 34093149331
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/candidate
      - run: python3 .github/menu-touch-v0461/prepare_release.py "$RUNNER_TEMP/candidate" "$RUNNER_TEMP/site" "$RUNNER_TEMP/rollback"
      - uses: actions/upload-artifact@v4
        with:
          name: ever-deeper-before-v0461-rollback
          path: ${{ runner.temp }}/rollback
          retention-days: 30
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ runner.temp }}/site
  deploy:
    needs: package
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
  verify:
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 .github/menu-touch-v0461/prepare_release.py --verify-public
