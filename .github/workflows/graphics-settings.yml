name: Verify saved graphics settings
on:
  push:
    branches: [codex/graphics-settings-20260927]
    paths: ['.github/graphics-settings/**', '.github/workflows/graphics-settings.yml']
permissions: {contents: read, actions: read}
concurrency: {group: graphics-settings, cancel-in-progress: true}
jobs:
  verify:
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/download-artifact@v4
        with:
          name: music-candidate
          run-id: 36303234754
          github-token: ${{ github.token }}
          path: '${{ runner.temp }}/original-dev'
      - run: |
          python3 .github/graphics-settings/fetch-live.py "$RUNNER_TEMP/original-live"
          python3 .github/graphics-settings/build.py "$RUNNER_TEMP/original-dev" "$RUNNER_TEMP/candidate/dev" dev
          python3 .github/graphics-settings/build.py "$RUNNER_TEMP/original-live" "$RUNNER_TEMP/candidate/live" live
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: npm ci --ignore-scripts && npx playwright install webkit
      - name: Verify DEV settings first
        run: node .github/graphics-settings/review.mjs "$RUNNER_TEMP/candidate/dev" "$RUNNER_TEMP/evidence/dev" dev
      - name: Verify isolated LIVE candidate
        run: node .github/graphics-settings/review.mjs "$RUNNER_TEMP/candidate/live" "$RUNNER_TEMP/evidence/live" live
      - uses: actions/upload-artifact@v4
        with: {name: graphics-candidate, path: '${{ runner.temp }}/candidate', retention-days: 30}
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: graphics-evidence, path: '${{ runner.temp }}/evidence', retention-days: 30}
