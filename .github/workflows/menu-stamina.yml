name: Verify stamina recovery in menus LIVE and DEV
on:
  push:
    branches: [codex/menu-stamina-20260929]
    paths: ['scripts/progression/miner_training.gd','scripts/qa/suites/skills_browser_review.gd','.github/menu-stamina/**','.github/workflows/menu-stamina.yml']
permissions: {contents: read, actions: read}
concurrency: {group: menu-stamina, cancel-in-progress: true}
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - {flavor: live, artifact: 11014496819, run: 36525099372}
          - {flavor: dev, artifact: 11007955681, run: 36506876846}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: |
            .github/menu-stamina
            .github/diagnostics-v2
            scripts
            tools
      - uses: actions/download-artifact@v4
        with:
          artifact-ids: '${{ matrix.artifact }}'
          merge-multiple: true
          run-id: '${{ matrix.run }}'
          github-token: '${{ github.token }}'
          path: '${{ runner.temp }}/original'
      - run: python3 .github/menu-stamina/build.py "$RUNNER_TEMP/original" "$RUNNER_TEMP/candidate" '${{ matrix.flavor }}'
      - run: |
          curl -L --fail --retry 2 https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip -o "$RUNNER_TEMP/godot.zip"
          unzip -q "$RUNNER_TEMP/godot.zip" -d "$RUNNER_TEMP/godot"
          echo "$RUNNER_TEMP/godot" >> "$GITHUB_PATH"
      - run: python3 tools/qa.py --godot Godot_v4.7.2-stable_linux.x86_64 --pack "$RUNNER_TEMP/candidate/index.pck" --cases input premium-core build-flavor --output "$RUNNER_TEMP/core"
      - run: python3 tools/check_invariants.py > "$RUNNER_TEMP/core/invariants.log" 2>&1
        continue-on-error: true
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: 'menu-stamina-${{ matrix.flavor }}-core', path: '${{ runner.temp }}/core', retention-days: 30}
      - uses: actions/upload-artifact@v4
        with: {name: 'menu-stamina-${{ matrix.flavor }}-candidate', path: '${{ runner.temp }}/candidate', retention-days: 30}
  browser:
    needs: build
    strategy:
      fail-fast: false
      matrix: {flavor: [live, dev]}
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: |
            .github/menu-stamina
            .github/diagnostics-v2
      - uses: actions/download-artifact@v4
        with: {name: 'menu-stamina-${{ matrix.flavor }}-candidate', path: '${{ runner.temp }}/candidate'}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: npm ci --ignore-scripts && npx playwright install chromium webkit
      - run: node .github/menu-stamina/review.mjs "$RUNNER_TEMP/candidate" "$RUNNER_TEMP/evidence/menus" '${{ matrix.flavor }}'
      - if: matrix.flavor == 'live'
        run: node .github/diagnostics-v2/startup.mjs "$RUNNER_TEMP/candidate" "$RUNNER_TEMP/evidence/ordinary"
        env: {EXPECTED_VERSION: '1.0.2', CANDIDATE_SOURCE: '${{ github.sha }}'}
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: 'menu-stamina-${{ matrix.flavor }}-browser', path: '${{ runner.temp }}/evidence', retention-days: 30}
