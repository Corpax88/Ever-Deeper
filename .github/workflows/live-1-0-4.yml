name: Verify LIVE1.0.4 node hotfix
on:
  push:
    branches: [codex/live-1-0-4-20261001]
permissions: {contents: read, actions: read}
concurrency: {group: live-1-0-4, cancel-in-progress: true}
jobs:
  verify:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: |
            .github/diagnostics-v2
            .github/live-1-0-4
            assets/fx
            assets/treasury
            scripts
            tools
            docs
      - uses: actions/download-artifact@v4
        with:
          artifact-ids: '11157241499'
          merge-multiple: true
          run-id: '36854385131'
          github-token: '${{ github.token }}'
          path: '${{ runner.temp }}/original'
      - run: python3 .github/live-1-0-4/build.py "$RUNNER_TEMP/original" "$RUNNER_TEMP/candidate"
      - run: |
          curl -L --fail --retry 2 https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_macos.universal.zip -o "$RUNNER_TEMP/godot.zip"
          unzip -q "$RUNNER_TEMP/godot.zip" -d "$RUNNER_TEMP/godot"
          chmod +x "$RUNNER_TEMP/godot/Godot.app/Contents/MacOS/Godot"
          python3 tools/qa.py --godot "$RUNNER_TEMP/godot/Godot.app/Contents/MacOS/Godot" --pack "$RUNNER_TEMP/candidate/index.pck" --cases input premium-core build-flavor one-point-zero-migration --output "$RUNNER_TEMP/evidence/core"
      - run: python3 tools/check_invariants.py > "$RUNNER_TEMP/evidence/core/invariants.log" 2>&1
        continue-on-error: true
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: npm ci --ignore-scripts && npx playwright install chromium webkit
      - run: node .github/live-1-0-4/review.mjs "$RUNNER_TEMP/candidate" "$RUNNER_TEMP/evidence/browser" "$RUNNER_TEMP/original"
      - run: node .github/live-1-0-4/startup.mjs "$RUNNER_TEMP/candidate" "$RUNNER_TEMP/evidence/ordinary"
        env: {EXPECTED_VERSION: '1.0.4', CANDIDATE_SOURCE: '${{ github.sha }}'}
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: live-1-0-4-evidence, path: '${{ runner.temp }}/evidence', retention-days: 30}
      - uses: actions/upload-artifact@v4
        with: {name: live-1-0-4-candidate, path: '${{ runner.temp }}/candidate', retention-days: 30}
