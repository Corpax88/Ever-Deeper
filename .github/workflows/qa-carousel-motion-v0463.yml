name: WebKit carousel motion recording
on:
  push:
    branches: [codex-carousel-v0463]
    paths: ['.github/workflows/qa-carousel-motion-v0463.yml']
permissions:
  contents: read
  actions: read
jobs:
  layout:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - uses: actions/download-artifact@v4
        with:
          name: carousel-exact-candidates
          run-id: 34101916164
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/candidate
      - run: |
          npm ci
          npx playwright install --with-deps webkit
          python3 - <<'PY'
          from pathlib import Path
          p=Path('tools/visual-qa/capture-carousel.mjs')
          p.write_text(p.read_text().replace('"--pet-capture",',''))
          PY
      - run: MENU_TOUCH=1 OVERHAUL_GAMEPLAY=1 TOUCH_BROWSER=webkit SMALL_IPHONE=1 LIBGL_ALWAYS_SOFTWARE=1 node tools/visual-qa/capture-carousel.mjs --web-dir "$RUNNER_TEMP/candidate/live" --output-dir "$RUNNER_TEMP/evidence"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: carousel-webkit-motion
          path: ${{ runner.temp }}/evidence
