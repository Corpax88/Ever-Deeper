name: Swipe menu navigation validation
on:
  push:
    branches: [codex-swipe-menus-v0462]
    paths: ['.github/workflows/qa-swipe-v0462.yml']
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 .github/swipe-v0462/prepare.py "$RUNNER_TEMP/candidate"
      - uses: actions/upload-artifact@v4
        with:
          name: swipe-exact-candidates
          path: ${{ runner.temp }}/candidate
  test:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
          - {browser: chromium, side: dev, small: '0'}
          - {browser: chromium, side: live, small: '0'}
          - {browser: webkit, side: live, small: '1'}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - uses: actions/download-artifact@v4
        with:
          name: swipe-exact-candidates
          path: ${{ runner.temp }}/candidate
      - run: |
          npm ci
          npx playwright install --with-deps ${{ matrix.browser }}
      - run: MENU_TOUCH=1 OVERHAUL_GAMEPLAY=1 TOUCH_BROWSER=${{ matrix.browser }} SMALL_IPHONE=${{ matrix.small }} LIBGL_ALWAYS_SOFTWARE=1 node tools/visual-qa/capture-menu-touch.mjs --web-dir "$RUNNER_TEMP/candidate/${{ matrix.side }}" --output-dir "$RUNNER_TEMP/evidence"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: swipe-${{ matrix.browser }}-${{ matrix.side }}
          path: ${{ runner.temp }}/evidence
