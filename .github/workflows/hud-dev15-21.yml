name: Verify Skills caption and DEV spacing DEV15.21
on:
  push:
    branches: [codex/hud-dev15-21-20260929]
    paths: ['scripts/ui/premium_hud.gd','scripts/dev/developer_menu.gd','scripts/qa/suites/skills_browser_review.gd','assets/ui/skills/icons/skills-knot-blue-steel-v1.png','.github/hud-dev15-21/**','.github/workflows/hud-dev15-21.yml']
permissions: {contents: read, actions: read}
concurrency: {group: hud-dev15-21, cancel-in-progress: true}
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: |
            .github/hud-dev15-21
            .github/diagnostics-v2
            scripts
            tools
            assets/ui/skills/icons
      - uses: actions/download-artifact@v4
        with:
          artifact-ids: 10996042147
          merge-multiple: true
          run-id: 36479931785
          github-token: '${{ github.token }}'
          path: '${{ runner.temp }}/original'
      - run: |
          curl -L --fail --retry 2 https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip -o "$RUNNER_TEMP/godot.zip"
          unzip -q "$RUNNER_TEMP/godot.zip" -d "$RUNNER_TEMP/godot"
          echo "$RUNNER_TEMP/godot" >> "$GITHUB_PATH"
      - run: python3 .github/hud-dev15-21/build.py "$RUNNER_TEMP/original" "$RUNNER_TEMP/candidate" Godot_v4.7.2-stable_linux.x86_64
      - run: python3 tools/qa.py --godot Godot_v4.7.2-stable_linux.x86_64 --pack "$RUNNER_TEMP/candidate/index.pck" --cases input premium-core --output "$RUNNER_TEMP/core"
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: hud-dev15-21-core, path: '${{ runner.temp }}/core', retention-days: 30}
      - uses: actions/upload-artifact@v4
        with: {name: hud-dev15-21-candidate, path: '${{ runner.temp }}/candidate', retention-days: 30}
  browser:
    needs: build
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: |
            .github/hud-dev15-21
            .github/diagnostics-v2
      - uses: actions/download-artifact@v4
        with: {name: hud-dev15-21-candidate, path: '${{ runner.temp }}/candidate'}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: npm ci --ignore-scripts && npx playwright install chromium webkit
      - run: node .github/hud-dev15-21/review.mjs "$RUNNER_TEMP/candidate" "$RUNNER_TEMP/evidence/hud"
      - run: node .github/diagnostics-v2/startup.mjs "$RUNNER_TEMP/candidate" "$RUNNER_TEMP/evidence/ordinary"
        env: {EXPECTED_VERSION: '1.0.0-dev.15.21', CANDIDATE_SOURCE: '${{ github.sha }}'}
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: hud-dev15-21-browser, path: '${{ runner.temp }}/evidence', retention-days: 30}
