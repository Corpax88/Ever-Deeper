name: Extract reviewed DEV7 guide images from the original artifact
on:
  push:
    branches: [codex-ever-deeper-1-0]
    paths: [.github/workflows/drill-guide-review-extract.yml, tools/review_one_point_zero.gd]
permissions:
  contents: read
  actions: read
jobs:
  extract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Download and verify the immutable original native artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api repos/Corpax88/Ever-Deeper/actions/artifacts/10306892797/zip > "$RUNNER_TEMP/native.zip"
          python3 - <<'PY'
          import hashlib, json, os, zipfile
          from pathlib import Path, PurePosixPath
          root = Path(os.environ['RUNNER_TEMP'])
          archive = root / 'native.zip'
          expected = '643fc257155bf2e7baaa1d6b6af0bffad8f7719e53bcea999c5e84d47dde1831'
          assert hashlib.sha256(archive.read_bytes()).hexdigest() == expected
          output = root / 'guide-review'
          output.mkdir()
          with zipfile.ZipFile(archive) as source:
              review = json.loads(source.read('review.json'))
              assert review['automated_assertions_passed'] and review['failures'] == []
              assert review['artifact']['sha256'] == 'a3885cc33cc80174d961df0c2149180e6b9ea7cb2f63158b6c4302bdc9329dd6'
              selected = [item for item in review['captures'] if item['file'].startswith('02-drill-guide-')]
              assert len(selected) == 18
              for item in selected:
                  name = item['file']
                  assert PurePosixPath(name).name == name and name.endswith('.png')
                  data = source.read(name)
                  assert hashlib.sha256(data).hexdigest() == item['sha256']
                  (output / name).write_bytes(data)
              for name in ['review.json', 'mole/mole-review.json', 'receivers/mining-receivers.json']:
                  (output / PurePosixPath(name).name).write_bytes(source.read(name))
          (output / 'source-artifact.json').write_text(json.dumps({'source_run_id':34723555713, 'source_artifact_id':10306892797, 'source_zip_sha256':expected, 'captures':selected}, indent=2) + '\n')
          PY
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: 34723555713
          name: ever-deeper-one-point-zero-dev-candidate
          path: ${{ runner.temp }}/candidate
      - name: Capture the same PCK with centered framing and flushed frozen-world drawing
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
          XDG_DATA_HOME: ${{ runner.temp }}/guide-userdata
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y xvfb libgl1-mesa-dri libasound2t64
          curl -fLsS https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip -o "$RUNNER_TEMP/godot.zip"
          unzip -q "$RUNNER_TEMP/godot.zip" -d "$RUNNER_TEMP/godot"
          mkdir -p "$RUNNER_TEMP/pack-run" "$RUNNER_TEMP/centered-review"
          cp -R "$RUNNER_TEMP/candidate/." "$RUNNER_TEMP/pack-run/"
          python3 - <<'PY'
          import hashlib, os
          from pathlib import Path
          pack = Path(os.environ['RUNNER_TEMP'])/'pack-run/dev/index.pck'
          assert hashlib.sha256(pack.read_bytes()).hexdigest() == 'a3885cc33cc80174d961df0c2149180e6b9ea7cb2f63158b6c4302bdc9329dd6'
          PY
          xvfb-run -a -s '-screen 0 2560x1440x24' timeout 240 "$RUNNER_TEMP/godot/Godot_v4.7.2-stable_linux.x86_64" --path "$RUNNER_TEMP/pack-run" --main-pack "$RUNNER_TEMP/pack-run/dev/index.pck" --script "$GITHUB_WORKSPACE/tools/review_one_point_zero.gd" --resolution 2532x1170 --audio-driver Dummy -- --pack-source="$RUNNER_TEMP/pack-run/dev/index.pck" --output="$RUNNER_TEMP/centered-review" --drill-guide-only > "$RUNNER_TEMP/centered-review/native.log" 2>&1
          if rg 'SCRIPT ERROR|Parse Error|^ERROR:|CHECK_FAILED' "$RUNNER_TEMP/centered-review/native.log"; then exit 1; fi
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          report = json.loads((Path(os.environ['RUNNER_TEMP'])/'centered-review/review.json').read_text())
          assert report['automated_assertions_passed'] and report['failures'] == [] and len(report['captures']) == 18
          assert report['artifact']['sha256'] == 'a3885cc33cc80174d961df0c2149180e6b9ea7cb2f63158b6c4302bdc9329dd6'
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: ever-deeper-drill-guide-review-extract
          path: ${{ runner.temp }}/guide-review
          retention-days: 30
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ever-deeper-drill-guide-centered-review
          path: ${{ runner.temp }}/centered-review
          retention-days: 30
          if-no-files-found: error
