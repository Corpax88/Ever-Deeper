name: Measure distinct FPS round two candidates
on:
  push:
    branches: [codex/fps-round2-20260928]
    paths: ['.github/fps-round2/**', '.github/workflows/fps-round2.yml']
permissions: {contents: read, actions: read}
concurrency: {group: fps-round2, cancel-in-progress: true}
jobs:
  audit:
    strategy:
      fail-fast: false
      matrix: {worker: [1, 2]}
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: |
            .github/fps-round2
            .github/surface-light-probe
      - uses: actions/download-artifact@v4
        with:
          name: surface-probe-candidate
          run-id: 36380070907
          github-token: ${{ github.token }}
          path: '${{ runner.temp }}/original'
      - run: python3 .github/fps-round2/build.py "$RUNNER_TEMP/original" "$RUNNER_TEMP/audit"
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: npm ci --ignore-scripts && npm install --no-save --package-lock=false pngjs && npx playwright install webkit
      - run: node .github/fps-round2/review.mjs "$RUNNER_TEMP/audit" "$RUNNER_TEMP/evidence"
        env: {AUDIT_WORKER: '${{ matrix.worker }}'}
        timeout-minutes: 10
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: 'fps-round2-${{ matrix.worker }}', path: '${{ runner.temp }}/evidence', retention-days: 30}
