name: Visual QA Mossvein first cave

on:
  push:
    branches: [codex-mossvein-first-cave-qa]
    paths:
      - '.github/workflows/visual-qa-mossvein-first-cave.yml'
      - '.github/dev-patch/mossvein-first-cave.xdelta.part*'
      - '.github/dev-patch/mossvein-corner-overlap-*.xdelta'
      - 'assets/mossvein/cave-edge-loop-v2.png'
      - 'assets/mossvein/cave-corner-v2.png'
      - 'assets/mossvein/permanent-edge-loop-v2.png'
      - 'assets/mossvein/permanent-corner-v2.png'
      - 'scripts/world/mossvein_mine.gd'
      - 'scripts/world/cave_edge_asset_drawer.gd'
      - 'scripts/world/world_catalog.gd'
      - 'tools/visual-qa/capture-web-visuals.mjs'

permissions:
  contents: read

jobs:
  capture-mobile-candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out visual QA candidate
        uses: actions/checkout@v4

      - name: Reconstruct exact candidate without deployment
        shell: bash
        run: |
          set -euo pipefail
          build_dir="$RUNNER_TEMP/ever-deeper-mossvein-base"
          tool_dir="$RUNNER_TEMP/tools"
          base_url="https://corpax88.github.io/Ever-Deeper"
          mkdir -p "$build_dir" "$tool_dir"

          for file in \
            index.apple-touch-icon.png \
            index.audio.position.worklet.js \
            index.audio.worklet.js \
            index.icon.png \
            index.js \
            index.png \
            index.wasm \
            index.pck
          do
            curl -L --fail --retry 4 --retry-all-errors \
              "$base_url/$file?visual_qa=$GITHUB_SHA" -o "$build_dir/$file"
          done

          echo "27408d8b450ea9b0664fa639129e01dd79bdee7dfb494319cd06106d64e647d5  $build_dir/index.apple-touch-icon.png" | sha256sum -c -
          echo "be33985bc7160d6bf9646f259cd86b259cd67b02ccb297ee5c44f8ac84327bc8  $build_dir/index.audio.position.worklet.js" | sha256sum -c -
          echo "5b476a9c9ce642c0ee4256436d1bc31d9c38f868aca0f9a8e2a57c18d2dec2a3  $build_dir/index.audio.worklet.js" | sha256sum -c -
          echo "290a6f61f9e48f2e30becbf93da69a002e839742cbeb556d36bd409b8fbf3bec  $build_dir/index.icon.png" | sha256sum -c -
          echo "33c94cb3175f3333b82e2a3be5e8e86f77986f0aa2042b1631f6367a4e5bb6ba  $build_dir/index.js" | sha256sum -c -
          echo "c0167be478bcbc291bb752bb503d9f0ba527b64d93a62523ad915c9ad96b8d3f  $build_dir/index.png" | sha256sum -c -
          echo "fc74679e3b97f76878947fcd4fbe1268cbfa6188182a2e33bbc3f5dc9bfa57d0  $build_dir/index.wasm" | sha256sum -c -
          echo "65a13e3af4a64ce247071cd2d5a75cb14e89bcc0664462753862e212a84549be  $build_dir/index.pck" | sha256sum -c -
          cp "$GITHUB_WORKSPACE/.github/dev-build/index.html" "$build_dir/index.html"

          cat "$GITHUB_WORKSPACE"/.github/dev-patch/prod-v0420-to-dev-v0420-dev7-final.xdelta.part* \
            > "$RUNNER_TEMP/prod-to-dev7.xdelta"
          echo "d7e6d905786f519997130e4c0959b36e121e7bac87bd9689f07972ca9db4396a  $RUNNER_TEMP/prod-to-dev7.xdelta" | sha256sum -c -

          curl -L --fail --retry 4 --retry-all-errors \
            https://github.com/jmacd/xdelta/releases/download/v3.2.0/xdelta3-3.2.0-linux-x86_64.tar.gz \
            -o "$tool_dir/xdelta3.tar.gz"
          echo "480295c7a41fea6503659f19ddc61676c0df4834e2292846ba97de30c68c2397  $tool_dir/xdelta3.tar.gz" | sha256sum -c -
          tar --no-same-owner -xzf "$tool_dir/xdelta3.tar.gz" -C "$tool_dir"
          chmod +x "$tool_dir/xdelta3-3.2.0-linux-x86_64/xdelta3"
          xdelta="$tool_dir/xdelta3-3.2.0-linux-x86_64/xdelta3"

          "$xdelta" -d -s "$build_dir/index.pck" \
            "$RUNNER_TEMP/prod-to-dev7.xdelta" "$RUNNER_TEMP/dev7.pck"
          echo "81d3e2f630fc54de00df87b1da5d98809b197725bb60c8087a55026306af2ca9  $RUNNER_TEMP/dev7.pck" | sha256sum -c -

          cat "$GITHUB_WORKSPACE"/.github/dev-patch/mossvein-first-cave.xdelta.part* \
            > "$RUNNER_TEMP/mossvein-first-cave.xdelta"
          echo "48d8f9156ab90883a3ab649367f90b5cceb520d6ca999e8a47fc6d09770ed4ef  $RUNNER_TEMP/mossvein-first-cave.xdelta" | sha256sum -c -
          test "$(stat -c %s "$RUNNER_TEMP/mossvein-first-cave.xdelta")" -eq 1153042

          "$xdelta" -d -s "$RUNNER_TEMP/dev7.pck" \
            "$RUNNER_TEMP/mossvein-first-cave.xdelta" "$RUNNER_TEMP/current-candidate.pck"
          echo "a70dbab1d3cb66afdd36fa43a5d1d6840ccd428af337ad8add4996d8dbf8520b  $RUNNER_TEMP/current-candidate.pck" | sha256sum -c -
          test "$(stat -c %s "$RUNNER_TEMP/current-candidate.pck")" -eq 106383940

          echo "3f279c92e5e909f2848c592373f0fa196bd7f04bc49158800d43e8f26f873b0f  $GITHUB_WORKSPACE/.github/dev-patch/mossvein-corner-overlap-before.xdelta" | sha256sum -c -
          echo "c4ec5483c053fba2987ed3fb54354be0a15ab97bcfbce7a30a47b2f25827c84d  $GITHUB_WORKSPACE/.github/dev-patch/mossvein-corner-overlap-after.xdelta" | sha256sum -c -
          echo "28b223a1fcc4cf4e3be54000f09faabd0ea193b50c9cc8d5aa0de6fa2d6ea84d  $GITHUB_WORKSPACE/.github/dev-patch/mossvein-corner-overlap-final.xdelta" | sha256sum -c -
          test "$(stat -c %s "$GITHUB_WORKSPACE/.github/dev-patch/mossvein-corner-overlap-before.xdelta")" -eq 23919
          test "$(stat -c %s "$GITHUB_WORKSPACE/.github/dev-patch/mossvein-corner-overlap-after.xdelta")" -eq 119783
          test "$(stat -c %s "$GITHUB_WORKSPACE/.github/dev-patch/mossvein-corner-overlap-final.xdelta")" -eq 99704

          for variant in before after final
          do
            variant_dir="$RUNNER_TEMP/ever-deeper-mossvein-$variant"
            mkdir -p "$variant_dir"
            "$xdelta" -d -s "$RUNNER_TEMP/current-candidate.pck" \
              "$GITHUB_WORKSPACE/.github/dev-patch/mossvein-corner-overlap-$variant.xdelta" \
              "$variant_dir/index.pck"
            for file in \
              index.apple-touch-icon.png \
              index.audio.position.worklet.js \
              index.audio.worklet.js \
              index.icon.png \
              index.js \
              index.png \
              index.wasm
            do
              cp "$build_dir/$file" "$variant_dir/$file"
            done
            size="$(stat -c %s "$variant_dir/index.pck")"
            sed "s/\"index.pck\":105337792/\"index.pck\":$size/" \
              "$GITHUB_WORKSPACE/.github/dev-build/index.html" > "$variant_dir/index.html"
            grep -q 'v0.42.0-dev.7' "$variant_dir/index.html"
            test "$(find "$variant_dir" -maxdepth 1 -type f | wc -l)" -eq 9
          done

          echo "a8c095f7da04edaeca83b305830eb71754fbabc30cf75d8fbfa1dbaed3533b18  $RUNNER_TEMP/ever-deeper-mossvein-before/index.pck" | sha256sum -c -
          echo "58da162d10611470229d481754d0048f802a0b8a8d89d4796f39cce20845a3a9  $RUNNER_TEMP/ever-deeper-mossvein-before/index.html" | sha256sum -c -
          echo "8ace63c113daaaa8f9bf18f4445256add886018807faf0ebb5ff3e227cd99a3b  $RUNNER_TEMP/ever-deeper-mossvein-after/index.pck" | sha256sum -c -
          echo "a72eb29693e15f289c6a6f4c10f21da6b454edd7ea42777c9d9fc1a7f54c510c  $RUNNER_TEMP/ever-deeper-mossvein-after/index.html" | sha256sum -c -
          echo "4955fb0e48467eac8a0dc000075e04673e2d45df41744b70af27f17902bcbbfc  $RUNNER_TEMP/ever-deeper-mossvein-final/index.pck" | sha256sum -c -
          echo "4f8d616acd1d788047b5f22276515db94d3735ec3011c99523aa1dcf1be9b140  $RUNNER_TEMP/ever-deeper-mossvein-final/index.html" | sha256sum -c -

      - name: Install capture browser
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Capture mined-shape before and after plus final normal states
        run: |
          node tools/visual-qa/capture-web-visuals.mjs \
            --web-dir "$RUNNER_TEMP/ever-deeper-mossvein-before" \
            --output-dir "$RUNNER_TEMP/visual-captures/before-tight" \
            --capture-limit 1
          node tools/visual-qa/capture-web-visuals.mjs \
            --web-dir "$RUNNER_TEMP/ever-deeper-mossvein-after" \
            --output-dir "$RUNNER_TEMP/visual-captures/after-tight" \
            --capture-limit 1
          node tools/visual-qa/capture-web-visuals.mjs \
            --web-dir "$RUNNER_TEMP/ever-deeper-mossvein-final" \
            --output-dir "$RUNNER_TEMP/visual-captures/final-normal" \
            --capture-limit 3

      - name: Upload visual evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mossvein-corner-overlap-before-after
          path: ${{ runner.temp }}/visual-captures
          compression-level: 0
          retention-days: 7
