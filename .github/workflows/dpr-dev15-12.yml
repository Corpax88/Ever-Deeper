name: Validate optional DPR DEV15.12
on:
  push:
    branches: [codex/dpr-dev15-12-20260927]
    paths: ['.github/dpr-dev15-12/**', '.github/workflows/dpr-dev15-12.yml']
permissions: {contents: read, actions: read}
concurrency: {group: dpr-dev15-12, cancel-in-progress: true}
jobs:
  focus:
    runs-on: macos-15
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: |
            scripts
            .github/dpr-dev15-12
      - uses: actions/download-artifact@v4
        with:
          name: music-candidate
          run-id: 36303234754
          github-token: ${{ github.token }}
          path: '${{ runner.temp }}/original'
      - run: python3 .github/dpr-dev15-12/build.py "$RUNNER_TEMP/original" "$RUNNER_TEMP/focus"
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: npm ci --ignore-scripts && npm install --no-save --package-lock=false pngjs && npx playwright install webkit
      - run: node .github/dpr-dev15-12/review.mjs "$RUNNER_TEMP/focus" "$RUNNER_TEMP/evidence"
      - uses: actions/upload-artifact@v4
        with: {name: dpr-candidate, path: '${{ runner.temp }}/focus', retention-days: 30}
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: dpr-dev15-12, path: '${{ runner.temp }}/evidence', retention-days: 30}
