name: Verify five mod animation sequences
on:
  push:
    branches: [codex/mod-motion-20261002]
permissions: {contents: read, actions: read}
concurrency: {group: mod-motion, cancel-in-progress: true}
jobs:
  verify:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: |
            .github/deep-treasury
            .github/mod-motion
            assets/ui/mods
            scripts
            tools
            docs
      - uses: actions/download-artifact@v4
        with:
          artifact-ids: '11245738008'
          merge-multiple: true
          run-id: '37049694489'
          github-token: '${{ github.token }}'
          path: '${{ runner.temp }}/original'
      - run: python3 .github/mod-motion/build.py "$RUNNER_TEMP/original" "$RUNNER_TEMP/candidate"
      - run: |
          curl -L --fail --retry 2 https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_macos.universal.zip -o "$RUNNER_TEMP/godot.zip"
          unzip -q "$RUNNER_TEMP/godot.zip" -d "$RUNNER_TEMP/godot"
          chmod +x "$RUNNER_TEMP/godot/Godot.app/Contents/MacOS/Godot"
          python3 tools/qa.py --godot "$RUNNER_TEMP/godot/Godot.app/Contents/MacOS/Godot" --pack "$RUNNER_TEMP/candidate/index.pck" --cases input premium-core --output "$RUNNER_TEMP/evidence/core"
      - run: |
          MODS_OUT="$RUNNER_TEMP/evidence/mechanics" XDG_DATA_HOME="$RUNNER_TEMP/mechanics-user" "$RUNNER_TEMP/godot/Godot.app/Contents/MacOS/Godot" --headless --path . --main-pack "$RUNNER_TEMP/candidate/index.pck" --script "$GITHUB_WORKSPACE/tools/review_five_mechanics.gd"
      - run: python3 tools/check_invariants.py > "$RUNNER_TEMP/evidence/core/invariants.log" 2>&1
        continue-on-error: true
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: npm ci --ignore-scripts && npx playwright install chromium webkit
      - run: node .github/mod-motion/review.mjs "$RUNNER_TEMP/candidate" "$RUNNER_TEMP/evidence/browser" dev
      - run: node .github/deep-treasury/startup.mjs "$RUNNER_TEMP/candidate" "$RUNNER_TEMP/evidence/ordinary"
        env: {EXPECTED_VERSION: '1.0.0-dev.15.49', CANDIDATE_SOURCE: '${{ github.sha }}'}
      - name: Package bounded review transport
        if: always()
        run: |
          python3 - <<'PYCODE'
          import os,pathlib,zipfile,hashlib,json
          root=pathlib.Path(os.environ['RUNNER_TEMP']); folder=root/'evidence'; output=root/'transport';output.mkdir()
          archive=root/'review.zip'
          with zipfile.ZipFile(archive,'w',zipfile.ZIP_DEFLATED) as z:
              for p in folder.rglob('*'):
                  if p.is_file():z.write(p,str(p.relative_to(folder)))
          raw=archive.read_bytes();parts=[]
          for i,start in enumerate(range(0,len(raw),24*1024*1024)):
              data=raw[start:start+24*1024*1024];name='part'+str(i)+'.bin';(output/name).write_bytes(data);parts.append({'name':name,'sha256':hashlib.sha256(data).hexdigest()})
          (output/'index.json').write_text(json.dumps({'sha256':hashlib.sha256(raw).hexdigest(),'parts':parts}))
          PYCODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mod-motion-review-part0
          path: |
            ${{ runner.temp }}/transport/part0.bin
            ${{ runner.temp }}/transport/index.json
          retention-days: 30
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mod-motion-review-part1
          path: |
            ${{ runner.temp }}/transport/part1.bin
            ${{ runner.temp }}/transport/index.json
          retention-days: 30
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mod-motion-review-part2
          path: |
            ${{ runner.temp }}/transport/part2.bin
            ${{ runner.temp }}/transport/index.json
          retention-days: 30
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mod-motion-review-part3
          path: |
            ${{ runner.temp }}/transport/part3.bin
            ${{ runner.temp }}/transport/index.json
          retention-days: 30
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mod-motion-review-part4
          path: |
            ${{ runner.temp }}/transport/part4.bin
            ${{ runner.temp }}/transport/index.json
          retention-days: 30
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mod-motion-review-part5
          path: |
            ${{ runner.temp }}/transport/part5.bin
            ${{ runner.temp }}/transport/index.json
          retention-days: 30
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: mod-motion-evidence, path: '${{ runner.temp }}/evidence', retention-days: 30}
      - uses: actions/upload-artifact@v4
        with: {name: mod-motion-candidate, path: '${{ runner.temp }}/candidate', retention-days: 30}

