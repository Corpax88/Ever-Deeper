name: Publish reviewed additive Worn trial
on:
  push:
    branches: [main]
    paths: ['.github/native-flow-trial/review.json', '.github/workflows/publish-native-worn-trial.yml']
permissions:
  contents: read
concurrency:
  group: pages-ever-deeper
  cancel-in-progress: false
jobs:
  package:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: sudo apt-get update -qq && sudo apt-get install -y xdelta3
      - name: Verify exact reviewed trial and retain every existing game file
        run: python3 .github/native-flow-trial/publish.py prepare "$RUNNER_TEMP/worn"
      - uses: actions/upload-artifact@v4
        with:
          name: ever-deeper-before-worn-trial-rollback
          path: ${{ runner.temp }}/worn/rollback
          retention-days: 30
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: ever-deeper-worn-trial-staging
          path: ${{ runner.temp }}/worn/staging.json
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ runner.temp }}/worn/site
  deploy:
    needs: package
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
  verify:
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: python3 .github/native-flow-trial/publish.py verify "$RUNNER_TEMP/verified"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ever-deeper-worn-trial-publication-receipt
          path: ${{ runner.temp }}/verified/publication-receipt.json
          if-no-files-found: error
