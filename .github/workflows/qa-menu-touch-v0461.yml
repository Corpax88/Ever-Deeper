name: iPhone menu touch and layout checks
on:
  push:
    branches: [codex-menu-touch-v0461]
    paths: ['.github/menu-touch-v0461/**', '.github/workflows/qa-menu-touch-v0461.yml', 'tools/visual-qa/capture-menu-touch.mjs']
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - {browser: chromium, side: dev, small: '0'}
          - {browser: chromium, side: live, small: '0'}
          - {browser: webkit, side: live, small: '1'}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: python3 .github/menu-touch-v0461/prepare_candidate.py "$RUNNER_TEMP/candidate"
      - run: |
          npm ci
          npx playwright install --with-deps ${{ matrix.browser }}
      - run: MENU_TOUCH=1 OVERHAUL_GAMEPLAY=1 TOUCH_BROWSER=${{ matrix.browser }} SMALL_IPHONE=${{ matrix.small }} LIBGL_ALWAYS_SOFTWARE=1 node tools/visual-qa/capture-menu-touch.mjs --web-dir "$RUNNER_TEMP/candidate/${{ matrix.side }}" --output-dir "$RUNNER_TEMP/evidence"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: touch-${{ matrix.browser }}-${{ matrix.side }}
          path: ${{ runner.temp }}/evidence
      - uses: actions/upload-artifact@v4
        if: matrix.side == 'dev'
        with:
          name: touch-exact-candidates
          path: ${{ runner.temp }}/candidate
  layout:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - uses: actions/download-artifact@v4
        with:
          name: touch-exact-candidates
          path: ${{ runner.temp }}/candidate
      - run: |
          npm ci
          npx playwright install --with-deps chromium
      - run: CAPTURE_END=9 node tools/visual-qa/capture-menu-touch.mjs --web-dir "$RUNNER_TEMP/candidate/live" --output-dir "$RUNNER_TEMP/evidence"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: touch-pet-layout
          path: ${{ runner.temp }}/evidence
