name: Test THE BUTTON prototype

on:
  push:
    branches: ["the-button-prototype-test"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Reconstruct exact prototype artifact
        shell: bash
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/the-button.b64" <<'B64'

B64
          base64 -d "$RUNNER_TEMP/the-button.b64" > "$RUNNER_TEMP/the-button.zip"
          unzip -q "$RUNNER_TEMP/the-button.zip" -d "$RUNNER_TEMP/prototype"
          test -f "$RUNNER_TEMP/prototype/the-button-prototype/project.godot"

      - name: Download Godot 4.7.2 stable
        shell: bash
        run: |
          set -euo pipefail
          curl -L --fail --retry 4 --retry-all-errors \
            'https://downloads.godotengine.org/?flavor=stable&platform=linux.64&slug=linux.x86_64.zip&version=4.7.2' \
            -o "$RUNNER_TEMP/godot.zip"
          unzip -q "$RUNNER_TEMP/godot.zip" -d "$RUNNER_TEMP/godot"
          chmod +x "$RUNNER_TEMP"/godot/Godot_v4.7.2-stable_linux.x86_64
          "$RUNNER_TEMP"/godot/Godot_v4.7.2-stable_linux.x86_64 --version

      - name: Parse and boot project headless
        shell: bash
        run: |
          set -euo pipefail
          GODOT="$RUNNER_TEMP/godot/Godot_v4.7.2-stable_linux.x86_64"
          PROJ="$RUNNER_TEMP/prototype/the-button-prototype"
          "$GODOT" --headless --path "$PROJ" --editor --quit 2>&1 | tee "$RUNNER_TEMP/editor.log"
          ! grep -E 'SCRIPT ERROR|Parse Error|ERROR:' "$RUNNER_TEMP/editor.log"
          "$GODOT" --headless --path "$PROJ" --quit-after 2 2>&1 | tee "$RUNNER_TEMP/boot.log"
          ! grep -E 'SCRIPT ERROR|Parse Error|ERROR:' "$RUNNER_TEMP/boot.log"

      - name: Gameplay self-test
        shell: bash
        run: |
          set -euo pipefail
          GODOT="$RUNNER_TEMP/godot/Godot_v4.7.2-stable_linux.x86_64"
          PROJ="$RUNNER_TEMP/prototype/the-button-prototype"
          mkdir -p "$PROJ/tests"
          cat > "$PROJ/tests/self_test.gd" <<'GDS'
extends SceneTree

var failed := false

func _initialize() -> void:
    call_deferred("_run")

func check(condition: bool, message: String) -> void:
    if condition:
        print("PASS: ", message)
    else:
        failed = true
        push_error("FAIL: " + message)

func _run() -> void:
    var packed := load("res://main.tscn")
    check(packed != null, "main scene loads")
    if packed == null:
        quit(1)
        return
    var scene = packed.instantiate()
    root.add_child(scene)
    await process_frame
    await process_frame
    check(scene.main_button != null, "main button exists")
    check(scene.successes >= 0, "progress state initialized")

    scene.current_mode = 0
    scene.mode_rounds_left = 2
    var before: int = scene.successes
    scene._on_button_pressed()
    await process_frame
    check(scene.successes == before + 1, "normal press counts as success")

    scene.attempts = 10
    scene.misses = 0
    scene.intervals = [0.10, 0.10, 0.10, 0.10, 0.10, 0.10, 0.10]
    scene._update_profile()
    check(scene.current_profile == "AUTOCLICKER", "autoclicker pattern is detected")

    scene.attempts = 10
    scene.misses = 0
    scene.intervals = [2.0, 2.1, 2.0, 2.2, 2.0, 2.1]
    scene._update_profile()
    check(scene.current_profile == "HESITATOR", "hesitation pattern is detected")

    scene.attempts = 10
    scene.misses = 4
    scene.intervals = [0.8, 0.9, 0.8, 0.9, 0.8, 0.9]
    scene._update_profile()
    check(scene.current_profile == "MISCLICKER", "misclick pattern is detected")

    scene.current_mode = 3
    scene.mode_rounds_left = 2
    before = scene.successes
    scene.double_first_ms = 0
    scene._on_button_pressed()
    scene._on_button_pressed()
    await process_frame
    check(scene.successes == before + 1, "double-tap challenge succeeds")

    print("SELFTEST_RESULT=", "FAIL" if failed else "PASS")
    quit(1 if failed else 0)
GDS
          "$GODOT" --headless --path "$PROJ" --script res://tests/self_test.gd 2>&1 | tee "$RUNNER_TEMP/selftest.log"
          grep -q 'SELFTEST_RESULT=PASS' "$RUNNER_TEMP/selftest.log"
