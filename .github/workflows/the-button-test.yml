name: Test THE BUTTON prototype

on:
  push:
    branches: ["the-button-prototype-test"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Reconstruct exact Godot project
        shell: bash
        run: |
          set -euo pipefail
          PROJ="$RUNNER_TEMP/the-button-prototype"
          mkdir -p "$PROJ/scripts"
          cp .github/testdata/the-button-project/project.godot "$PROJ/project.godot"
          cp .github/testdata/the-button-project/main.tscn "$PROJ/main.tscn"
          cat .github/testdata/the-button-project/scripts/main.gd.part* > "$PROJ/scripts/main.gd"
          echo "341a0a9d60b4b7e00125c56b41fcee5dfc987035dfaef25a03d1f29370579dcf  $PROJ/project.godot" | sha256sum -c -
          echo "2c2f3bb1b1a610ad695f4a05dd6012033ce6dc0c6a158824d4d7db1ff64ad5f4  $PROJ/main.tscn" | sha256sum -c -
          echo "32b892ce77ecca2c544dbf2ab8f02e0eedcceb1b4c2d3a126a7572980ae866d5  $PROJ/scripts/main.gd" | sha256sum -c -

      - name: Download Godot 4.7.2 stable
        shell: bash
        run: |
          set -euo pipefail
          curl -L --fail --retry 4 --retry-all-errors \
            'https://downloads.godotengine.org/?flavor=stable&platform=linux.64&slug=linux.x86_64.zip&version=4.7.2' \
            -o "$RUNNER_TEMP/godot.zip"
          unzip -q "$RUNNER_TEMP/godot.zip" -d "$RUNNER_TEMP/godot"
          chmod +x "$RUNNER_TEMP"/godot/Godot_v4.7.2-stable_linux.x86_64
          "$RUNNER_TEMP"/godot/Godot_v4.7.2-stable_linux.x86_64 --version

      - name: Parse and boot project headless
        shell: bash
        run: |
          set -euo pipefail
          GODOT="$RUNNER_TEMP/godot/Godot_v4.7.2-stable_linux.x86_64"
          PROJ="$RUNNER_TEMP/the-button-prototype"
          "$GODOT" --headless --path "$PROJ" --editor --quit 2>&1 | tee "$RUNNER_TEMP/editor.log"
          ! grep -E 'SCRIPT ERROR|Parse Error' "$RUNNER_TEMP/editor.log"
          "$GODOT" --headless --path "$PROJ" --quit-after 2 2>&1 | tee "$RUNNER_TEMP/boot.log"
          ! grep -E 'SCRIPT ERROR|Parse Error' "$RUNNER_TEMP/boot.log"

      - name: Gameplay self-test
        shell: bash
        run: |
          set -euo pipefail
          GODOT="$RUNNER_TEMP/godot/Godot_v4.7.2-stable_linux.x86_64"
          PROJ="$RUNNER_TEMP/the-button-prototype"
          mkdir -p "$PROJ/tests"
          cp .github/testdata/the-button-self-test.gd "$PROJ/tests/self_test.gd"
          set +e
          timeout 20s "$GODOT" --headless --verbose --path "$PROJ" --script res://tests/self_test.gd 2>&1 | tee "$RUNNER_TEMP/selftest.log"
          status=${PIPESTATUS[0]}
          set -e
          if [ "$status" -eq 124 ]; then
            echo 'SELFTEST_TIMEOUT'
            exit 124
          fi
          [ "$status" -eq 0 ]
          grep -q 'SELFTEST_RESULT=PASS' "$RUNNER_TEMP/selftest.log"
