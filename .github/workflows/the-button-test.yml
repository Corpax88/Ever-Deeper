name: Test THE BUTTON prototype

on:
  push:
    branches: ["the-button-prototype-test"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Reconstruct exact prototype artifact
        shell: bash
        run: |
          set -euo pipefail
          cat .github/testdata/button_parts/part* > "$RUNNER_TEMP/the-button.b64"
          echo "7f3a0c001eb506e3058fc821e1b42e0c78569acd7715c614fcd03fe9abda5fc8  $RUNNER_TEMP/the-button.b64" | sha256sum -c -
          base64 -d "$RUNNER_TEMP/the-button.b64" > "$RUNNER_TEMP/the-button.zip"
          echo "cb9837bd47bd4f8832dc921a6c9a0118c33d01ab062359de9b6c081fec75f55b  $RUNNER_TEMP/the-button.zip" | sha256sum -c -
          unzip -q "$RUNNER_TEMP/the-button.zip" -d "$RUNNER_TEMP/prototype"
          test -f "$RUNNER_TEMP/prototype/the-button-prototype/project.godot"

      - name: Download Godot 4.7.2 stable
        shell: bash
        run: |
          set -euo pipefail
          curl -L --fail --retry 4 --retry-all-errors \
            'https://downloads.godotengine.org/?flavor=stable&platform=linux.64&slug=linux.x86_64.zip&version=4.7.2' \
            -o "$RUNNER_TEMP/godot.zip"
          unzip -q "$RUNNER_TEMP/godot.zip" -d "$RUNNER_TEMP/godot"
          chmod +x "$RUNNER_TEMP"/godot/Godot_v4.7.2-stable_linux.x86_64
          "$RUNNER_TEMP"/godot/Godot_v4.7.2-stable_linux.x86_64 --version

      - name: Parse and boot project headless
        shell: bash
        run: |
          set -euo pipefail
          GODOT="$RUNNER_TEMP/godot/Godot_v4.7.2-stable_linux.x86_64"
          PROJ="$RUNNER_TEMP/prototype/the-button-prototype"
          "$GODOT" --headless --path "$PROJ" --editor --quit 2>&1 | tee "$RUNNER_TEMP/editor.log"
          ! grep -E 'SCRIPT ERROR|Parse Error' "$RUNNER_TEMP/editor.log"
          "$GODOT" --headless --path "$PROJ" --quit-after 2 2>&1 | tee "$RUNNER_TEMP/boot.log"
          ! grep -E 'SCRIPT ERROR|Parse Error' "$RUNNER_TEMP/boot.log"

      - name: Gameplay self-test
        shell: bash
        run: |
          set -euo pipefail
          GODOT="$RUNNER_TEMP/godot/Godot_v4.7.2-stable_linux.x86_64"
          PROJ="$RUNNER_TEMP/prototype/the-button-prototype"
          mkdir -p "$PROJ/tests"
          cp .github/testdata/the-button-self-test.gd "$PROJ/tests/self_test.gd"
          set +e
          timeout 20s "$GODOT" --headless --verbose --path "$PROJ" --script res://tests/self_test.gd 2>&1 | tee "$RUNNER_TEMP/selftest.log"
          status=${PIPESTATUS[0]}
          set -e
          if [ "$status" -eq 124 ]; then
            echo 'SELFTEST_TIMEOUT'
            exit 124
          fi
          [ "$status" -eq 0 ]
          grep -q 'SELFTEST_RESULT=PASS' "$RUNNER_TEMP/selftest.log"
