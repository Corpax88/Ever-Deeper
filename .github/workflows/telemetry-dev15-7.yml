name: Verify private session reports DEV15.7
on:
  push:
    branches: [codex/telemetry-dev15-7-20260924]
    paths: ['scripts/**', 'tools/session-reports-browser.js', '.github/telemetry-dev15-7/**', '.github/workflows/telemetry-dev15-7.yml']
permissions:
  contents: read
concurrency:
  group: telemetry-dev15-7-qa
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Install matching engine
        run: |
          curl -L --fail --retry 2 https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip -o "$RUNNER_TEMP/godot.zip"
          unzip -q "$RUNNER_TEMP/godot.zip" -d "$RUNNER_TEMP/godot"
          echo "$RUNNER_TEMP/godot" >> "$GITHUB_PATH"
      - name: Build exact candidate
        run: python3 .github/telemetry-dev15-7/build.py Godot_v4.7.2-stable_linux.x86_64 "$RUNNER_TEMP/dev15-7"
      - name: Protected differences
        continue-on-error: true
        run: python3 tools/check_invariants.py > "$RUNNER_TEMP/dev15-7/invariants.log" 2>&1
      - name: Exported input, touch, developer tools and flavor
        run: python3 tools/qa.py --godot Godot_v4.7.2-stable_linux.x86_64 --pack "$RUNNER_TEMP/dev15-7/candidate/index.pck" --cases input touch dev-tools build-flavor --output "$RUNNER_TEMP/dev15-7/core"
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: dev15-7-candidate, path: '${{ runner.temp }}/dev15-7/candidate', retention-days: 90}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dev15-7-build-review
          path: |
            ${{ runner.temp }}/dev15-7/*.json
            ${{ runner.temp }}/dev15-7/*.log
            ${{ runner.temp }}/dev15-7/core
          retention-days: 90
  browser:
    needs: build
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/download-artifact@v4
        with: {name: dev15-7-candidate, path: '${{ runner.temp }}/candidate'}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: npm ci --ignore-scripts && npx playwright install chromium webkit
      - name: Actual gameplay recording and private transfer contract
        run: node .github/telemetry-dev15-7/review.mjs "$RUNNER_TEMP/candidate" "$RUNNER_TEMP/dev15-7-browser"
      - name: Apple WebKit report transfer
        env: {REPORT_BROWSER: webkit}
        run: node .github/telemetry-dev15-7/review.mjs "$RUNNER_TEMP/candidate" "$RUNNER_TEMP/dev15-7-report-webkit"
      - name: Ordinary Apple WebKit startup and save
        env: {EXPECTED_VERSION: 1.0.0-dev.15.7, CANDIDATE_SOURCE: '${{ github.sha }}'}
        run: node .github/dev14-startup/inspect.mjs "$RUNNER_TEMP/candidate" "$RUNNER_TEMP/dev15-7-webkit"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dev15-7-browser-review
          path: |
            ${{ runner.temp }}/dev15-7-browser
            ${{ runner.temp }}/dev15-7-webkit
            ${{ runner.temp }}/dev15-7-report-webkit
          retention-days: 90
