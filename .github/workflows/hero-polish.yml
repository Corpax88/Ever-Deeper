name: Verify fitted hero motion
on:
  push:
    branches: [codex/hero-polish-20261002]
permissions: {contents: read, actions: read}
concurrency: {group: hero-polish, cancel-in-progress: true}
jobs:
  verify:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: |
            .github/hero-polish
            .github/five-mods
            .github/deep-treasury
            assets/native-worn
            scripts
            tools
            docs
      - uses: actions/download-artifact@v4
        with:
          artifact-ids: '11251552127'
          merge-multiple: true
          run-id: '37062377003'
          github-token: '${{ github.token }}'
          path: '${{ runner.temp }}/original'
      - run: python3 .github/hero-polish/build.py "$RUNNER_TEMP/original" "$RUNNER_TEMP/candidate"
      - run: |
          curl -L --fail --retry 2 https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_macos.universal.zip -o "$RUNNER_TEMP/godot.zip"
          unzip -q "$RUNNER_TEMP/godot.zip" -d "$RUNNER_TEMP/godot"
          chmod +x "$RUNNER_TEMP/godot/Godot.app/Contents/MacOS/Godot"
          python3 tools/qa.py --godot "$RUNNER_TEMP/godot/Godot.app/Contents/MacOS/Godot" --pack "$RUNNER_TEMP/candidate/index.pck" --cases input premium-core --output "$RUNNER_TEMP/evidence/core"
          python3 .github/hero-polish/run_native.py "$RUNNER_TEMP/godot/Godot.app/Contents/MacOS/Godot" "$RUNNER_TEMP/candidate/index.pck" "$GITHUB_WORKSPACE/tools/review_hero_polish.gd" "$RUNNER_TEMP/evidence/native"
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: npm ci --ignore-scripts && npx playwright install webkit
      - run: node .github/deep-treasury/startup.mjs "$RUNNER_TEMP/candidate" "$RUNNER_TEMP/evidence/ordinary"
        env: {EXPECTED_VERSION: '1.0.0-dev.15.50', CANDIDATE_SOURCE: '${{ github.sha }}'}
      - name: Bound review transport
        if: always()
        run: |
          python3 - <<'PY'
          import os,pathlib,zipfile
          root=pathlib.Path(os.environ['RUNNER_TEMP']);out=root/'review';out.mkdir()
          with zipfile.ZipFile(out/'hero-review.zip','w',zipfile.ZIP_DEFLATED) as z:
            for p in (root/'evidence').rglob('*'):
              if p.is_file() and (p.suffix in ['.json','.log'] or p.name in ['worn-008-game.png','worn-004.png','worn-008.png','worn-012.png','crown-010-game.png'] or p.parent.name=='ordinary' and p.suffix=='.png'):
                z.write(p,str(p.relative_to(root/'evidence')))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: hero-review, path: '${{ runner.temp }}/review', retention-days: 30}
      - uses: actions/upload-artifact@v4
        with: {name: hero-polish-candidate, path: '${{ runner.temp }}/candidate', retention-days: 30}
