name: Inspect coherent surface v0.44.0-dev.2
on:
  push:
    branches: [codex-surface-v2]
    paths: ['.github/surface-v2/**', '.github/workflows/qa-surface-v2.yml', 'tools/visual-qa/capture-surface-v2.mjs']
permissions:
  contents: read
jobs:
  surface:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python3 .github/surface-v2/prepare_candidate.py "$RUNNER_TEMP/surface-web"
      - run: |
          npm ci
          npx playwright install --with-deps chromium
      - run: node tools/visual-qa/capture-surface-v2.mjs --web-dir "$RUNNER_TEMP/surface-web" --output-dir "$RUNNER_TEMP/surface-evidence"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: surface-v2-visual-evidence
          path: ${{ runner.temp }}/surface-evidence
          retention-days: 14
      - uses: actions/upload-artifact@v4
        with:
          name: surface-v2-exact-web-candidate
          path: ${{ runner.temp }}/surface-web
          retention-days: 14
