name: Cache Godot 4.7.2 tool

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/tool-cache-godot-472.yml'

permissions:
  contents: read

jobs:
  cache-tool:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Download and verify Godot editor
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/godot-4.7.2"
          curl --location --fail --silent --show-error \
            --retry 4 --retry-all-errors \
            --proto '=https' --proto-redir '=https' \
            https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip \
            --output "$RUNNER_TEMP/godot-4.7.2/editor.zip"
          echo "cadd3204e728a35d3f13adb7fd0d7902636b79f6b95c40c265eb73b6c35329e4  $RUNNER_TEMP/godot-4.7.2/editor.zip" | sha256sum -c -
          test "$(stat -c %s "$RUNNER_TEMP/godot-4.7.2/editor.zip")" -eq 77860424
          unzip -q "$RUNNER_TEMP/godot-4.7.2/editor.zip" -d "$RUNNER_TEMP/godot-4.7.2"
          rm "$RUNNER_TEMP/godot-4.7.2/editor.zip"
          chmod 0755 "$RUNNER_TEMP/godot-4.7.2/Godot_v4.7.2-stable_linux.x86_64"
          "$RUNNER_TEMP/godot-4.7.2/Godot_v4.7.2-stable_linux.x86_64" --version | grep -F '4.7.2.stable'
      - name: Upload verified editor
        uses: actions/upload-artifact@v4
        with:
          name: godot-4.7.2-linux-x86_64
          path: ${{ runner.temp }}/godot-4.7.2/Godot_v4.7.2-stable_linux.x86_64
          compression-level: 0
          retention-days: 1
          if-no-files-found: error
