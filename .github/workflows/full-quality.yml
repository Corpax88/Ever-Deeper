name: Full Ever-Deeper Quality Review
on:
  push:
    branches: [codex/full-quality-20261004]
    paths:
      - '.github/full-quality/**'
      - '.github/workflows/full-quality.yml'
permissions: {contents: read, actions: read}
concurrency: {group: full-quality-20261004, cancel-in-progress: false}
env:
  BASE_VERSION: '1.0.0-dev.15.54'
jobs:
  graphical:
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/download-artifact@v4
        with:
          artifact-ids: '11284088414'
          merge-multiple: true
          run-id: '37151451383'
          github-token: '${{ github.token }}'
          path: '${{ runner.temp }}/original'
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: npm ci --ignore-scripts && npx playwright install chromium webkit
      - name: Build baseline with QA-only overlay
        run: python3 .github/full-quality/prepare.py "$RUNNER_TEMP/original" "$RUNNER_TEMP/baseline"
      - name: Original production breadth and touch captures
        id: baseline
        continue-on-error: true
        run: node .github/full-quality/review.mjs "$RUNNER_TEMP/baseline" "$RUNNER_TEMP/evidence/baseline"
        env: {EXPECTED_VERSION: '${{ env.BASE_VERSION }}'}
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: full-quality-baseline, path: '${{ runner.temp }}/evidence/baseline', retention-days: 30}
      - name: Ordinary unchanged WebKit startup
        continue-on-error: true
        run: node .github/deep-treasury/startup.mjs "$RUNNER_TEMP/original" "$RUNNER_TEMP/evidence/ordinary-baseline"
        env: {EXPECTED_VERSION: '${{ env.BASE_VERSION }}', CANDIDATE_SOURCE: 'be3a698e0ad8bedb91e877b9932a7bb05b80684a'}
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: full-quality-ordinary-baseline, path: '${{ runner.temp }}/evidence/ordinary-baseline', retention-days: 30}
      - name: Detect explicit production candidate
        id: candidate
        run: |
          python3 - <<'PY'
          import json,os
          changed=json.load(open('.github/full-quality/overrides.json'))
          with open(os.environ['GITHUB_OUTPUT'],'a') as f: f.write('enabled='+str(bool(changed)).lower()+'\n')
          PY
      - name: Build explicit production candidate
        if: steps.candidate.outputs.enabled == 'true'
        run: python3 .github/full-quality/prepare.py "$RUNNER_TEMP/original" "$RUNNER_TEMP/candidate" .github/full-quality/overrides.json
      - name: Candidate breadth and touch captures
        if: steps.candidate.outputs.enabled == 'true'
        id: review_candidate
        continue-on-error: true
        run: node .github/full-quality/review.mjs "$RUNNER_TEMP/candidate" "$RUNNER_TEMP/evidence/candidate"
        env: {EXPECTED_VERSION: '${{ env.BASE_VERSION }}'}
      - uses: actions/upload-artifact@v4
        if: always() && steps.candidate.outputs.enabled == 'true'
        with: {name: full-quality-candidate-evidence, path: '${{ runner.temp }}/evidence/candidate', retention-days: 30}
      - name: Install exact native engine for candidate regression
        if: steps.candidate.outputs.enabled == 'true'
        run: |
          curl -L --fail --retry 2 https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_macos.universal.zip -o "$RUNNER_TEMP/godot.zip"
          unzip -q "$RUNNER_TEMP/godot.zip" -d "$RUNNER_TEMP/godot"
          chmod +x "$RUNNER_TEMP/godot/Godot.app/Contents/MacOS/Godot"
          "$RUNNER_TEMP/godot/Godot.app/Contents/MacOS/Godot" --version
      - name: Save retry candidate regression
        if: steps.candidate.outputs.enabled == 'true'
        continue-on-error: true
        run: |
          if python3 -c "import json; assert 'scripts/state/run_state.gd' in json.load(open('.github/full-quality/overrides.json'))"; then
            mkdir -p "$RUNNER_TEMP/evidence/save-retry"
            "$RUNNER_TEMP/godot/Godot.app/Contents/MacOS/Godot" --headless --path . --main-pack "$RUNNER_TEMP/candidate/index.pck" --script tools/review_save_retry.gd -- --output="$RUNNER_TEMP/evidence/save-retry" > "$RUNNER_TEMP/evidence/save-retry/godot.log" 2>&1
          fi
      - uses: actions/upload-artifact@v4
        if: always() && steps.candidate.outputs.enabled == 'true'
        with: {name: full-quality-native-regression, path: '${{ runner.temp }}/evidence/save-retry', retention-days: 30}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: full-quality-package-receipts
          path: |
            ${{ runner.temp }}/baseline/qa-build-receipt.json
            ${{ runner.temp }}/candidate/qa-build-receipt.json
          retention-days: 30
      - name: Enforce recorded browser gates
        if: always()
        run: |
          python3 - <<'PY'
          import json,os
          from pathlib import Path
          root=Path(os.environ['RUNNER_TEMP'])/'evidence'
          for name in ['baseline']+(['candidate'] if json.load(open('.github/full-quality/overrides.json')) else []):
              p=root/name/'report.json'
              assert p.exists(),str(p)
              assert json.loads(p.read_text())['passed'],str(p)
          PY
  recover:
    if: ${{ !contains(github.event.head_commit.message, '[qa-no-recovery]') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/download-artifact@v4
        with:
          artifact-ids: '11284088414'
          merge-multiple: true
          run-id: '37151451383'
          github-token: '${{ github.token }}'
          path: '${{ runner.temp }}/original'
      - run: python3 .github/full-quality/split.py "$RUNNER_TEMP/original" "$RUNNER_TEMP/recovery"
      - uses: actions/upload-artifact@v4
        with: {name: recovery-manifest, path: '${{ runner.temp }}/recovery/recovery-manifest.json', retention-days: 7}
      - uses: actions/upload-artifact@v4
        with: {name: recovery-00, path: '${{ runner.temp }}/recovery/part-00.bin', compression-level: 0, if-no-files-found: ignore, retention-days: 7}
      - uses: actions/upload-artifact@v4
        with: {name: recovery-01, path: '${{ runner.temp }}/recovery/part-01.bin', compression-level: 0, if-no-files-found: ignore, retention-days: 7}
      - uses: actions/upload-artifact@v4
        with: {name: recovery-02, path: '${{ runner.temp }}/recovery/part-02.bin', compression-level: 0, if-no-files-found: ignore, retention-days: 7}
      - uses: actions/upload-artifact@v4
        with: {name: recovery-03, path: '${{ runner.temp }}/recovery/part-03.bin', compression-level: 0, if-no-files-found: ignore, retention-days: 7}
      - uses: actions/upload-artifact@v4
        with: {name: recovery-04, path: '${{ runner.temp }}/recovery/part-04.bin', compression-level: 0, if-no-files-found: ignore, retention-days: 7}
      - uses: actions/upload-artifact@v4
        with: {name: recovery-05, path: '${{ runner.temp }}/recovery/part-05.bin', compression-level: 0, if-no-files-found: ignore, retention-days: 7}
      - uses: actions/upload-artifact@v4
        with: {name: recovery-06, path: '${{ runner.temp }}/recovery/part-06.bin', compression-level: 0, if-no-files-found: ignore, retention-days: 7}
      - uses: actions/upload-artifact@v4
        with: {name: recovery-07, path: '${{ runner.temp }}/recovery/part-07.bin', compression-level: 0, if-no-files-found: ignore, retention-days: 7}
      - uses: actions/upload-artifact@v4
        with: {name: recovery-08, path: '${{ runner.temp }}/recovery/part-08.bin', compression-level: 0, if-no-files-found: ignore, retention-days: 7}
      - uses: actions/upload-artifact@v4
        with: {name: recovery-09, path: '${{ runner.temp }}/recovery/part-09.bin', compression-level: 0, if-no-files-found: ignore, retention-days: 7}
      - uses: actions/upload-artifact@v4
        with: {name: recovery-10, path: '${{ runner.temp }}/recovery/part-10.bin', compression-level: 0, if-no-files-found: ignore, retention-days: 7}
      - uses: actions/upload-artifact@v4
        with: {name: recovery-11, path: '${{ runner.temp }}/recovery/part-11.bin', compression-level: 0, if-no-files-found: ignore, retention-days: 7}
      - uses: actions/upload-artifact@v4
        with: {name: recovery-12, path: '${{ runner.temp }}/recovery/part-12.bin', compression-level: 0, if-no-files-found: ignore, retention-days: 7}
      - uses: actions/upload-artifact@v4
        with: {name: recovery-13, path: '${{ runner.temp }}/recovery/part-13.bin', compression-level: 0, if-no-files-found: ignore, retention-days: 7}
