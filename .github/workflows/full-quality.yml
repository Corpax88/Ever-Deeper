name: Full Ever-Deeper Quality Review
on:
  workflow_dispatch:
  push:
    branches: [codex/full-quality-20261004]
    paths:
      - '.github/full-quality/run.json'
permissions: {contents: read, actions: read}
concurrency: {group: full-quality-20261004, cancel-in-progress: false}
env:
  BASE_VERSION: '1.0.0-dev.15.54'
  CANDIDATE_VERSION: '1.0.0-dev.15.55'
  RUN_BASELINE_SUPPLEMENT: 'false'
jobs:
  native:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with: {ref: '${{ github.sha }}', persist-credentials: false}
      - uses: actions/download-artifact@v4
        with:
          artifact-ids: '11284088414'
          merge-multiple: true
          run-id: '37151451383'
          github-token: '${{ github.token }}'
          path: '${{ runner.temp }}/original'
      - name: Prepare exact baseline QA and production candidate
        run: |
          python3 .github/full-quality/prepare.py "$RUNNER_TEMP/original" "$RUNNER_TEMP/baseline"
          python3 .github/full-quality/prepare.py "$RUNNER_TEMP/original" "$RUNNER_TEMP/candidate" .github/full-quality/overrides.json
          python3 .github/full-quality/prepare.py "$RUNNER_TEMP/original" "$RUNNER_TEMP/production" .github/full-quality/overrides.json production
      - name: Install exact native engine
        run: |
          curl -L --fail --retry 2 https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_macos.universal.zip -o "$RUNNER_TEMP/godot.zip"
          unzip -q "$RUNNER_TEMP/godot.zip" -d "$RUNNER_TEMP/godot"
          chmod +x "$RUNNER_TEMP/godot/Godot.app/Contents/MacOS/Godot"
          "$RUNNER_TEMP/godot/Godot.app/Contents/MacOS/Godot" --version
      - name: Focused native regressions against exact production pack
        continue-on-error: true
        run: python3 .github/full-quality/native.py "$RUNNER_TEMP/godot/Godot.app/Contents/MacOS/Godot" "$RUNNER_TEMP/production/index.pck" "$RUNNER_TEMP/evidence/native" "$RUNNER_TEMP/candidate/index.pck"
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: full-quality-native, path: '${{ runner.temp }}/evidence/native', retention-days: 30}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: full-quality-package-receipts
          path: |
            ${{ runner.temp }}/baseline/qa-build-receipt.json
            ${{ runner.temp }}/candidate/qa-build-receipt.json
            ${{ runner.temp }}/production/qa-build-receipt.json
          retention-days: 30
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: full-quality-production-candidate, path: '${{ runner.temp }}/production', retention-days: 30}
      - name: Enforce independently recorded native gates
        if: always()
        run: |
          python3 - <<'PY'
          import json,os
          from pathlib import Path
          p=Path(os.environ['RUNNER_TEMP'])/'evidence/native/report.json'
          assert p.exists() and json.loads(p.read_text()).get('passed',False), 'native failed or missing'
          PY
  graphical:
    name: Graphical (${{ matrix.group }})
    runs-on: macos-15
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - {group: candidate, script: .github/full-quality/review.mjs, pack: candidate}
          - {group: focused, script: .github/full-quality/focused.mjs, pack: candidate}
          - {group: ricochet-lifecycle, script: .github/full-quality/ricochet-lifecycle.mjs, pack: candidate}
          - {group: journey, script: .github/full-quality/journey.mjs, pack: candidate}
          - {group: ordinary-candidate, script: .github/deep-treasury/startup.mjs, pack: production}
          - {group: baseline-missing, script: .github/full-quality/missing.mjs, pack: baseline}
    steps:
      - uses: actions/checkout@v4
        if: matrix.group != 'baseline-missing' || env.RUN_BASELINE_SUPPLEMENT == 'true'
        with: {ref: '${{ github.sha }}', persist-credentials: false}
      - uses: actions/download-artifact@v4
        if: matrix.group != 'baseline-missing' || env.RUN_BASELINE_SUPPLEMENT == 'true'
        with:
          artifact-ids: '11284088414'
          merge-multiple: true
          run-id: '37151451383'
          github-token: '${{ github.token }}'
          path: '${{ runner.temp }}/original'
      - name: Prepare exact baseline QA and production candidate
        if: matrix.group != 'baseline-missing' || env.RUN_BASELINE_SUPPLEMENT == 'true'
        run: |
          python3 .github/full-quality/prepare.py "$RUNNER_TEMP/original" "$RUNNER_TEMP/baseline"
          python3 .github/full-quality/prepare.py "$RUNNER_TEMP/original" "$RUNNER_TEMP/candidate" .github/full-quality/overrides.json
          python3 .github/full-quality/prepare.py "$RUNNER_TEMP/original" "$RUNNER_TEMP/production" .github/full-quality/overrides.json production
      - uses: actions/setup-node@v4
        if: matrix.group != 'baseline-missing' || env.RUN_BASELINE_SUPPLEMENT == 'true'
        with: {node-version: '22'}
      - run: npm ci --ignore-scripts && npx playwright install chromium webkit
        if: matrix.group != 'baseline-missing' || env.RUN_BASELINE_SUPPLEMENT == 'true'
      - name: Run all original checks in this browser group
        if: matrix.group != 'baseline-missing' || env.RUN_BASELINE_SUPPLEMENT == 'true'
        continue-on-error: true
        run: node "$REVIEW_SCRIPT" "$RUNNER_TEMP/$REVIEW_PACK" "$RUNNER_TEMP/evidence/$REVIEW_GROUP"
        env:
          REVIEW_SCRIPT: '${{ matrix.script }}'
          REVIEW_PACK: '${{ matrix.pack }}'
          REVIEW_GROUP: '${{ matrix.group }}'
          EXPECTED_VERSION: "${{ matrix.group == 'baseline-missing' && env.BASE_VERSION || env.CANDIDATE_VERSION }}"
          CANDIDATE_SOURCE: '${{ github.sha }}'
      - name: Split graphical evidence into files below 30MiB
        if: always() && (matrix.group != 'baseline-missing' || env.RUN_BASELINE_SUPPLEMENT == 'true')
        run: python3 .github/full-quality/split.py "$RUNNER_TEMP/evidence/$REVIEW_GROUP" "$RUNNER_TEMP/evidence-split/$REVIEW_GROUP"
        env: {REVIEW_GROUP: '${{ matrix.group }}'}
      - uses: actions/upload-artifact@v4
        if: always() && (matrix.group != 'baseline-missing' || env.RUN_BASELINE_SUPPLEMENT == 'true')
        with: {name: 'full-quality-${{ matrix.group }}-manifest', path: '${{ runner.temp }}/evidence-split/${{ matrix.group }}/recovery-manifest.json', if-no-files-found: ignore, retention-days: 30}
      - uses: actions/upload-artifact@v4
        if: always() && (matrix.group != 'baseline-missing' || env.RUN_BASELINE_SUPPLEMENT == 'true')
        with: {name: 'full-quality-${{ matrix.group }}-00', path: '${{ runner.temp }}/evidence-split/${{ matrix.group }}/part-00.bin', compression-level: 0, if-no-files-found: ignore, retention-days: 30}
      - uses: actions/upload-artifact@v4
        if: always() && (matrix.group != 'baseline-missing' || env.RUN_BASELINE_SUPPLEMENT == 'true')
        with: {name: 'full-quality-${{ matrix.group }}-01', path: '${{ runner.temp }}/evidence-split/${{ matrix.group }}/part-01.bin', compression-level: 0, if-no-files-found: ignore, retention-days: 30}
      - uses: actions/upload-artifact@v4
        if: always() && (matrix.group != 'baseline-missing' || env.RUN_BASELINE_SUPPLEMENT == 'true')
        with: {name: 'full-quality-${{ matrix.group }}-02', path: '${{ runner.temp }}/evidence-split/${{ matrix.group }}/part-02.bin', compression-level: 0, if-no-files-found: ignore, retention-days: 30}
      - uses: actions/upload-artifact@v4
        if: always() && (matrix.group != 'baseline-missing' || env.RUN_BASELINE_SUPPLEMENT == 'true')
        with: {name: 'full-quality-${{ matrix.group }}-03', path: '${{ runner.temp }}/evidence-split/${{ matrix.group }}/part-03.bin', compression-level: 0, if-no-files-found: ignore, retention-days: 30}
      - name: Enforce independently recorded browser gates
        if: always() && (matrix.group != 'baseline-missing' || env.RUN_BASELINE_SUPPLEMENT == 'true')
        env: {REVIEW_GROUP: '${{ matrix.group }}'}
        run: |
          python3 - <<'PY'
          import json,os
          from pathlib import Path
          name=os.environ['REVIEW_GROUP']
          p=Path(os.environ['RUNNER_TEMP'])/'evidence'/name/'report.json'
          assert p.exists(), name+' report missing'
          report=json.loads(p.read_text())
          if name=='ordinary-candidate':
              assert not report.get('failure') and not report.get('crashed') and report.get('completed_observation'), 'ordinary-candidate failed'
          else:
              assert report.get('passed',False), name+' failed'
          PY
  runtime-recovery:
    if: ${{ !contains(github.event.head_commit.message, '[qa-no-runtime]') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Download exact Linux engine and local X11 dependencies
        run: |
          mkdir -p "$RUNNER_TEMP/runtime/x11-debs"
          curl -L --fail --retry 2 https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip -o "$RUNNER_TEMP/runtime/godot-linux.zip"
          unzip -t "$RUNNER_TEMP/runtime/godot-linux.zip"
          cd "$RUNNER_TEMP/runtime/x11-debs"
          apt-get download xvfb libxfont2 x11-xkb-utils libxkbfile1
      - run: python3 .github/full-quality/split.py "$RUNNER_TEMP/runtime" "$RUNNER_TEMP/runtime-split"
      - uses: actions/upload-artifact@v4
        with: {name: linux-runtime-manifest, path: '${{ runner.temp }}/runtime-split/recovery-manifest.json', retention-days: 14}
      - uses: actions/upload-artifact@v4
        with: {name: linux-runtime-00, path: '${{ runner.temp }}/runtime-split/part-00.bin', compression-level: 0, if-no-files-found: ignore, retention-days: 14}
      - uses: actions/upload-artifact@v4
        with: {name: linux-runtime-01, path: '${{ runner.temp }}/runtime-split/part-01.bin', compression-level: 0, if-no-files-found: ignore, retention-days: 14}
      - uses: actions/upload-artifact@v4
        with: {name: linux-runtime-02, path: '${{ runner.temp }}/runtime-split/part-02.bin', compression-level: 0, if-no-files-found: ignore, retention-days: 14}
      - uses: actions/upload-artifact@v4
        with: {name: linux-runtime-03, path: '${{ runner.temp }}/runtime-split/part-03.bin', compression-level: 0, if-no-files-found: ignore, retention-days: 14}
