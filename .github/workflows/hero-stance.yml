name: Review native hero stance
on:
  push:
    branches: [codex/hero-stance-20260928]
    paths: ['.github/hero-stance/**', '.github/workflows/hero-stance.yml']
permissions: {contents: read, actions: read}
concurrency: {group: hero-stance, cancel-in-progress: true}
jobs:
  focus:
    runs-on: macos-15
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: |
            scripts
            .github/hero-stance
            .github/graphics-settings
      - uses: actions/download-artifact@v4
        with:
          name: graphics-candidate
          run-id: 36352372852
          github-token: ${{ github.token }}
          path: '${{ runner.temp }}/original'
      - run: python3 .github/hero-stance/build.py "$RUNNER_TEMP/original/dev" "$RUNNER_TEMP/focus"
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: npm ci --ignore-scripts && npm install --no-save --package-lock=false pngjs && npx playwright install webkit
      - run: node .github/hero-stance/review.mjs "$RUNNER_TEMP/focus" "$RUNNER_TEMP/evidence"
        timeout-minutes: 3
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: hero-stance, path: '${{ runner.temp }}/evidence', retention-days: 30}

      - uses: actions/upload-artifact@v4
        with: {name: hero-candidate, path: '${{ runner.temp }}/focus', retention-days: 30}
