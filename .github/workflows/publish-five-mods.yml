name: Publish Five Mods DEV15.48
on:
  push:
    branches: [main]
    paths: ['.github/five-mods/accepted.json', '.github/workflows/publish-five-mods.yml']
permissions: {contents: read, actions: read}
concurrency: {group: pages-ever-deeper, cancel-in-progress: false}
jobs:
  package:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: |
            .github/five-mods
            .github/workflows
      - id: accepted
        run: |
          python3 - <<'PYCODE'
          import json,os
          r=json.load(open('.github/five-mods/accepted.json'))
          with open(os.environ['GITHUB_OUTPUT'],'a') as f:
              print('run='+str(r['run']),file=f)
              print('artifact='+str(r['artifact']),file=f)
          PYCODE
      - uses: actions/download-artifact@v4
        with:
          artifact-ids: '${{ steps.accepted.outputs.artifact }}'
          run-id: '${{ steps.accepted.outputs.run }}'
          merge-multiple: true
          github-token: '${{ github.token }}'
          path: '${{ runner.temp }}/candidate'
      - run: python3 .github/five-mods/publish.py prepare "$RUNNER_TEMP/publication" "$RUNNER_TEMP/candidate"
        env: {GH_TOKEN: '${{ github.token }}'}
      - uses: actions/upload-artifact@v4
        with: {name: dev15-47-before-five-mods-rollback, path: '${{ runner.temp }}/publication/previous/dev', retention-days: 30}
      - uses: actions/upload-pages-artifact@v3
        with: {path: '${{ runner.temp }}/publication/site'}
  deploy:
    needs: package
    runs-on: ubuntu-latest
    permissions: {pages: write, id-token: write}
    environment:
      name: github-pages
      url: '${{ steps.deployment.outputs.page_url }}'
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
  verify:
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: |
            .github/five-mods
            .github/workflows
      - run: python3 .github/five-mods/publish.py verify "$RUNNER_TEMP/verified"
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: five-mods-publication-receipt, path: '${{ runner.temp }}/verified/publication-receipt.json'}


