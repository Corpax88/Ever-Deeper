name: Publish Reviewed Wall Focus DEV15.59
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/wall-focus/accepted.json']
permissions: {contents: read, actions: read}
concurrency: {group: pages-ever-deeper, cancel-in-progress: false}
jobs:
  package:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: |
            .github/wall-focus
            .github/visual-guidance
      - id: accepted
        run: python3 .github/wall-focus/publish.py inputs
      - uses: actions/download-artifact@v4
        with:
          artifact-ids: '${{ steps.accepted.outputs.artifacts }}'
          run-id: '${{ steps.accepted.outputs.run }}'
          merge-multiple: false
          github-token: '${{ github.token }}'
          path: '${{ runner.temp }}/accepted-artifacts'
      - name: Verify evidence, immutable artifacts and all previous public bytes
        run: python3 .github/wall-focus/publish.py prepare "$RUNNER_TEMP/publication" "$RUNNER_TEMP/accepted-artifacts"
        env: {GH_TOKEN: '${{ github.token }}'}
      - uses: actions/upload-artifact@v4
        with:
          name: wall-focus-dev15-58-rollback
          path: '${{ runner.temp }}/publication/rollback-dev'
          retention-days: 30
      - uses: actions/upload-artifact@v4
        with:
          name: wall-focus-staging-receipt
          path: '${{ runner.temp }}/publication/staging-receipt.json'
          retention-days: 30
      - uses: actions/upload-pages-artifact@v3
        with: {path: '${{ runner.temp }}/publication/site'}
  deploy:
    needs: package
    runs-on: ubuntu-latest
    permissions: {pages: write, id-token: write}
    environment:
      name: github-pages
      url: '${{ steps.deployment.outputs.page_url }}'
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
  verify:
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: |
            .github/wall-focus
            .github/visual-guidance
      - run: python3 .github/wall-focus/publish.py verify "$RUNNER_TEMP/verified"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: wall-focus-publication-receipt
          path: '${{ runner.temp }}/verified/publication-receipt.json'
          retention-days: 30
