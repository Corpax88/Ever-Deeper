name: Mossvein Mac GPU and WebKit
on:
  push:
    branches: [codex/mossvein-painted-20261114]
    paths: ['.github/moss-test/**', '.github/workflows/moss-test.yml']
permissions: {contents: read, actions: read}
concurrency: {group: moss-painted-qa, cancel-in-progress: true}
jobs:
  review:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Install matching Godot
        run: |
          curl -L --fail --retry 2 https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_macos.universal.zip -o "$RUNNER_TEMP/godot.zip"
          unzip -q "$RUNNER_TEMP/godot.zip" -d "$RUNNER_TEMP/godot"
          chmod +x "$RUNNER_TEMP/godot/Godot.app/Contents/MacOS/Godot"
      - name: Prepare Mossvein candidate
        run: |
          mkdir -p "$RUNNER_TEMP/original"
          for f in index.html index.js index.wasm index.pck index.png index.icon.png index.apple-touch-icon.png index.audio.worklet.js index.audio.position.worklet.js; do
            curl -fsSL --retry 2 "https://corpax88.github.io/Ever-Deeper/dev/$f" -o "$RUNNER_TEMP/original/$f"
          done
          "$RUNNER_TEMP/godot/Godot.app/Contents/MacOS/Godot" --headless --editor --import > "$RUNNER_TEMP/import.log"
          python3 .github/moss-test/prepare.py "$RUNNER_TEMP/original/index.pck" "$RUNNER_TEMP/candidate"
      - name: Render Mossvein and exercise mining at three mobile aspects
        run: python3 .github/moss-test/mac.py "$RUNNER_TEMP/godot/Godot.app/Contents/MacOS/Godot" "$RUNNER_TEMP/candidate/index.pck" "$RUNNER_TEMP/evidence"
      - name: Retained input regression
        run: python3 tools/qa.py --godot "$RUNNER_TEMP/godot/Godot.app/Contents/MacOS/Godot" --pack "$RUNNER_TEMP/candidate/index.pck" --cases input --output "$RUNNER_TEMP/evidence/input"
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: npm ci --ignore-scripts && npx playwright install webkit
      - name: Ordinary WebKit startup and save
        run: node .github/hunt-followup/startup.mjs "$RUNNER_TEMP/candidate" "$RUNNER_TEMP/evidence/webkit"
        env: {EXPECTED_VERSION: '1.0.0-dev.15.61', CANDIDATE_SOURCE: '${{ github.sha }}'}
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: moss-test-evidence, path: '${{ runner.temp }}/evidence', retention-days: 30}
