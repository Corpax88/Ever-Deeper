name: Inspect full overhaul v0.45.0-dev.1
on:
  push:
    branches: [codex-full-overhaul]
    paths: ['.github/overhaul/**', '.github/workflows/qa-overhaul.yml', 'tools/visual-qa/capture-overhaul.mjs']
permissions:
  contents: read
jobs:
  surface:
    strategy:
      fail-fast: false
      matrix:
        batch: [{start: 1, end: 30}, {start: 31, end: 60}, {start: 61, end: 90}, {start: 91, end: 120}, {start: 121, end: 150}, {start: 151, end: 180}, {start: 181, end: 210}, {start: 211, end: 240}, {start: 241, end: 270}, {start: 271, end: 300}, {start: 301, end: 303}]
    env:
      CAPTURE_START: ${{ matrix.batch.start }}
      CAPTURE_END: ${{ matrix.batch.end }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python3 .github/overhaul/prepare_candidate.py "$RUNNER_TEMP/surface-web"
      - run: |
          npm ci
          npx playwright install --with-deps chromium
      - run: node tools/visual-qa/capture-overhaul.mjs --web-dir "$RUNNER_TEMP/surface-web" --output-dir "$RUNNER_TEMP/surface-evidence"
      - if: matrix.batch.start == 1
        run: OVERHAUL_GAMEPLAY=1 node tools/visual-qa/capture-overhaul.mjs --web-dir "$RUNNER_TEMP/surface-web" --output-dir "$RUNNER_TEMP/gameplay-evidence"
      - uses: actions/upload-artifact@v4
        if: matrix.batch.start == 1 && always()
        with:
          name: overhaul-gameplay-evidence
          path: ${{ runner.temp }}/gameplay-evidence
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: overhaul-visual-evidence-${{ matrix.batch.start }}
          path: ${{ runner.temp }}/surface-evidence
          retention-days: 14
      - uses: actions/upload-artifact@v4
        with:
          name: overhaul-exact-web-candidate-${{ matrix.batch.start }}
          path: ${{ runner.temp }}/surface-web
          retention-days: 14
