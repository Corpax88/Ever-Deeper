name: Sustained mature hub rendering probe
on:
  push:
    branches: [codex-sustained-hub-probe]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install renderer
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y xvfb libgl1-mesa-dri ripgrep
          curl -L --fail --retry 3 https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip -o "$RUNNER_TEMP/godot.zip"
          unzip -q "$RUNNER_TEMP/godot.zip" -d "$RUNNER_TEMP/godot"
          echo "$RUNNER_TEMP/godot" >> "$GITHUB_PATH"
      - name: Import, check and render
        run: |
          mkdir -p "$RUNNER_TEMP/probe" "$RUNNER_TEMP/saves"
          Godot_v4.7.2-stable_linux.x86_64 --headless --editor --path . --import > "$RUNNER_TEMP/probe/import.log" 2>&1
          if rg 'SCRIPT ERROR|Parse Error|^ERROR:' "$RUNNER_TEMP/probe/import.log"; then exit 1; fi
          python3 tools/check_invariants.py
          XDG_DATA_HOME="$RUNNER_TEMP/saves" xvfb-run -a -s '-screen 0 2560x1440x24' Godot_v4.7.2-stable_linux.x86_64 --path . --resolution 2328x1260 --audio-driver Dummy -- --qa-sustained-hub --perf-effects --perf-effects-mossvein --perf-output="$RUNNER_TEMP/probe" > "$RUNNER_TEMP/probe/run.log" 2>&1
          if rg 'SCRIPT ERROR|Parse Error|^ERROR:' "$RUNNER_TEMP/probe/run.log"; then exit 1; fi
          rg 'SUSTAINED_HUB_ROW|SUSTAINED_HUB_COMPLETE' "$RUNNER_TEMP/probe/run.log"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sustained-hub-probe
          path: ${{ runner.temp }}/probe
          retention-days: 30
