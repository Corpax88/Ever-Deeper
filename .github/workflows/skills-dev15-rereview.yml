name: Verify immutable Skills DEV15 touch
on:
  push:
    branches: [codex/locked-skills-ui-20260922]
    paths: ['.github/skills-dev15/review.mjs', '.github/skills-dev15/reuse.py', '.github/skills-dev15/reuse.json', '.github/workflows/skills-dev15-rereview.yml']
permissions:
  contents: read
  actions: read
concurrency:
  group: skills-dev15-qa
  cancel-in-progress: false
env:
  CANDIDATE_SOURCE: f39f00b72e8cabf542dbed9dc02bb319d43046b7
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 10
      - uses: actions/download-artifact@v4
        with:
          name: dev15-candidate
          run-id: 35793750781
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: ${{ runner.temp }}/candidate
      - uses: actions/download-artifact@v4
        with:
          name: dev15-build-review
          run-id: 35793750781
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: ${{ runner.temp }}/build-review
      - name: Verify exact original export and passed core evidence
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 .github/skills-dev15/reuse.py "$RUNNER_TEMP/candidate" "$RUNNER_TEMP/build-review"
      - uses: actions/upload-artifact@v4
        with:
          name: dev15-candidate
          path: ${{ runner.temp }}/candidate
          retention-days: 90
      - uses: actions/upload-artifact@v4
        with:
          name: dev15-build-review
          path: ${{ runner.temp }}/build-review
          retention-days: 90
  browser:
    needs: build
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: dev15-candidate
          path: ${{ runner.temp }}/candidate
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts && npx playwright install chromium webkit
      - name: Actual touch and graphical Skills review
        run: node .github/skills-dev15/review.mjs "$RUNNER_TEMP/candidate" "$RUNNER_TEMP/dev15-browser"
      - name: Ordinary Apple WebKit new and saved games
        env:
          EXPECTED_VERSION: 1.0.0-dev.15
        run: node .github/dev14-startup/inspect.mjs "$RUNNER_TEMP/candidate" "$RUNNER_TEMP/dev15-webkit"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dev15-browser-review
          path: |
            ${{ runner.temp }}/dev15-browser
            ${{ runner.temp }}/dev15-webkit
          if-no-files-found: error
          retention-days: 90
