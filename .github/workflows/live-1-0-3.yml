name: Verify approved DEV15.38 promotion to LIVE 1.0.3
on:
  push:
    branches: [codex/live-1-0-3-20261001]
    paths: ['scripts/ui/premium_hud.gd','scripts/dev/developer_menu.gd','scripts/qa/suites/skills_browser_review.gd','assets/ui/skills/icons/skills-knot-blue-steel-v1.png','.github/live-1-0-3/**','.github/workflows/live-1-0-3.yml']
permissions: {contents: read, actions: read}
concurrency: {group: live-1-0-3, cancel-in-progress: true}
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: |
            .github/live-1-0-3
            .github/diagnostics-v2
            scripts
            tools
            assets/ui/skills/icons
      - uses: actions/download-artifact@v4
        with:
          artifact-ids: 11153881363
          merge-multiple: true
          run-id: 36846647651
          github-token: '${{ github.token }}'
          path: '${{ runner.temp }}/original'
      - run: |
          curl -L --fail --retry 2 https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip -o "$RUNNER_TEMP/godot.zip"
          unzip -q "$RUNNER_TEMP/godot.zip" -d "$RUNNER_TEMP/godot"
          echo "$RUNNER_TEMP/godot" >> "$GITHUB_PATH"
      - run: python3 .github/live-1-0-3/build.py "$RUNNER_TEMP/original" "$RUNNER_TEMP/candidate" Godot_v4.7.2-stable_linux.x86_64
      - run: python3 tools/qa.py --godot Godot_v4.7.2-stable_linux.x86_64 --pack "$RUNNER_TEMP/candidate/index.pck" --cases input premium-core build-flavor one-point-zero-migration --output "$RUNNER_TEMP/core"
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: live-1-0-3-core, path: '${{ runner.temp }}/core', retention-days: 30}
      - uses: actions/upload-artifact@v4
        with: {name: live-1-0-3-candidate, path: '${{ runner.temp }}/candidate', retention-days: 30}
  browser:
    needs: build
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: |
            .github/live-1-0-3
            .github/diagnostics-v2
      - uses: actions/download-artifact@v4
        with: {name: live-1-0-3-candidate, path: '${{ runner.temp }}/candidate'}
      - uses: actions/download-artifact@v4
        with:
          artifact-ids: 11033422171
          merge-multiple: true
          run-id: 36569827357
          github-token: '${{ github.token }}'
          path: '${{ runner.temp }}/legacy'
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: npm ci --ignore-scripts && npx playwright install chromium webkit
      - run: node .github/live-1-0-3/review.mjs "$RUNNER_TEMP/candidate" "$RUNNER_TEMP/evidence/hud" "$RUNNER_TEMP/legacy"
      - run: node .github/diagnostics-v2/startup.mjs "$RUNNER_TEMP/candidate" "$RUNNER_TEMP/evidence/ordinary"
        env: {EXPECTED_VERSION: '1.0.3', CANDIDATE_SOURCE: '${{ github.sha }}'}
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: live-1-0-3-browser, path: '${{ runner.temp }}/evidence', retention-days: 30}
