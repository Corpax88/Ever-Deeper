name: Diagnose ordinary DEV14 startup in Apple WebKit
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  startup:
    runs-on: macos-15
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: dev14-candidate
          run-id: 35596622855
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: ${{ runner.temp }}/candidate
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts && npx playwright install webkit
      - name: Observe actual menu and New Game with the unchanged published package
        run: node .github/dev14-startup/inspect.mjs "$RUNNER_TEMP/candidate" "$RUNNER_TEMP/startup"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dev14-webkit-startup
          path: ${{ runner.temp }}/startup
          retention-days: 30
          if-no-files-found: error
