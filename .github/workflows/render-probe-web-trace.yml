name: Compare WebGL engine startup with a standalone framebuffer
on:
  push:
    branches: [codex-render-probe]
    paths: ['.github/workflows/render-probe-web-trace.yml', '.github/dev-render-probe/web-baseline.mjs']
permissions:
  contents: read
  actions: read
jobs:
  trace:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        mode: ['menu', 'probe', 'minimal']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: dev-render-probe-candidate
          run-id: 34223377725
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/candidate
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Observe unchanged engine and standalone framebuffer
        run: |
          npm ci
          npx playwright install --with-deps webkit
          node .github/dev-render-probe/web-baseline.mjs "$RUNNER_TEMP/candidate" "$RUNNER_TEMP/review" '${{ matrix.mode }}'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: render-probe-webgl-baseline-${{ matrix.mode }}
          path: ${{ runner.temp }}/review
          retention-days: 30
