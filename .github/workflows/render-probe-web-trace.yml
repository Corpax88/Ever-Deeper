name: Trace WebGL probe warning on identical candidate
on:
  push:
    branches: [codex-render-probe]
    paths: ['.github/workflows/render-probe-web-trace.yml', '.github/dev-render-probe/web-trace.mjs']
permissions:
  contents: read
  actions: read
jobs:
  trace:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        screenshots: ['0', '1']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: dev-render-probe-candidate
          run-id: 34223377725
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/candidate
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Trace with and without screenshots
        env:
          PROBE_GL_TRACE: '1'
          PROBE_SCREENSHOTS: ${{ matrix.screenshots }}
        run: |
          npm ci
          npx playwright install --with-deps webkit
          node .github/dev-render-probe/web-trace.mjs "$RUNNER_TEMP/candidate" "$RUNNER_TEMP/review" hub
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: render-probe-gl-trace-${{ matrix.screenshots }}
          path: ${{ runner.temp }}/review
          retention-days: 30
