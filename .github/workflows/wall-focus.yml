name: Ever-Deeper wall and quest visibility DEV15.59
on:
  push:
    branches: [codex/wall-focus-20261005]
    paths: ['.github/wall-focus/run.json']
permissions: {contents: read, actions: read}
concurrency: {group: wall-focus-20261005, cancel-in-progress: true}
jobs:
  review:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/download-artifact@v4
        with:
          artifact-ids: '11366866551'
          run-id: '37360610341'
          github-token: '${{ github.token }}'
          merge-multiple: true
          path: '${{ runner.temp }}/original'
      - name: Prepare exact production candidate
        run: python3 .github/wall-focus/prepare.py "$RUNNER_TEMP/original/index.pck" "$RUNNER_TEMP/candidate"
      - name: Install matching Godot
        run: |
          curl -L --fail --retry 2 https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_macos.universal.zip -o "$RUNNER_TEMP/godot.zip"
          unzip -q "$RUNNER_TEMP/godot.zip" -d "$RUNNER_TEMP/godot"
          chmod +x "$RUNNER_TEMP/godot/Godot.app/Contents/MacOS/Godot"
      - name: Render both walls and quest layouts at three mobile aspects
        run: python3 .github/wall-focus/mac.py "$RUNNER_TEMP/godot/Godot.app/Contents/MacOS/Godot" "$RUNNER_TEMP/candidate/index.pck" "$RUNNER_TEMP/evidence"
      - name: Retained input regression
        run: python3 tools/qa.py --godot "$RUNNER_TEMP/godot/Godot.app/Contents/MacOS/Godot" --pack "$RUNNER_TEMP/candidate/index.pck" --cases input --output "$RUNNER_TEMP/evidence/input"
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: npm ci --ignore-scripts && npx playwright install webkit
      - name: Ordinary WebKit startup and save
        run: node .github/hunt-followup/startup.mjs "$RUNNER_TEMP/candidate" "$RUNNER_TEMP/evidence/webkit"
        env: {EXPECTED_VERSION: '1.0.0-dev.15.59', CANDIDATE_SOURCE: '${{ github.sha }}'}
      - uses: actions/upload-artifact@v4
        with: {name: wall-focus-production, path: '${{ runner.temp }}/candidate', retention-days: 30}
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: wall-focus-1334, path: '${{ runner.temp }}/evidence/1334', retention-days: 30}
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: wall-focus-1688, path: '${{ runner.temp }}/evidence/1688', retention-days: 30}
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: wall-focus-1864, path: '${{ runner.temp }}/evidence/1864', retention-days: 30}
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: wall-focus-input, path: '${{ runner.temp }}/evidence/input', retention-days: 30}
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: wall-focus-webkit, path: '${{ runner.temp }}/evidence/webkit', retention-days: 30}
