name: Deploy playable Mossvein first-cave QA to DEV

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/deploy-mossvein-dev-preview.yml'
      - '.github/dev-patch/mossvein-first-cave.xdelta.part*'
      - '.github/dev-patch/mossvein-corner-overlap-final.xdelta'
  workflow_dispatch:
    inputs:
      dev_version:
        description: DEV package to deploy
        required: true
        type: choice
        default: mossvein_candidate
        options:
          - mossvein_candidate
          - dev7_rollback

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-ever-deeper
  cancel-in-progress: true

jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      DEPLOY_VERSION: ${{ github.event_name == 'workflow_dispatch' && inputs.dev_version || 'mossvein_candidate' }}
    steps:
      - name: Check out verified DEV preview inputs
        uses: actions/checkout@v4

      - name: Preserve production and build Mossvein DEV preview
        shell: bash
        run: |
          set -euo pipefail
          pages_dir="$RUNNER_TEMP/ever-deeper-pages"
          dev_dir="$pages_dir/dev"
          tool_dir="$RUNNER_TEMP/tools"
          base_url="https://corpax88.github.io/Ever-Deeper"
          mkdir -p "$pages_dir" "$dev_dir" "$tool_dir"

          for file in \
            index.apple-touch-icon.png \
            index.audio.position.worklet.js \
            index.audio.worklet.js \
            index.icon.png \
            index.js \
            index.png \
            index.wasm \
            index.html \
            index.pck
          do
            curl -L --fail --retry 4 --retry-all-errors \
              "$base_url/$file?mossvein_dev=$GITHUB_SHA" -o "$pages_dir/$file"
          done

          echo "27408d8b450ea9b0664fa639129e01dd79bdee7dfb494319cd06106d64e647d5  $pages_dir/index.apple-touch-icon.png" | sha256sum -c -
          echo "be33985bc7160d6bf9646f259cd86b259cd67b02ccb297ee5c44f8ac84327bc8  $pages_dir/index.audio.position.worklet.js" | sha256sum -c -
          echo "5b476a9c9ce642c0ee4256436d1bc31d9c38f868aca0f9a8e2a57c18d2dec2a3  $pages_dir/index.audio.worklet.js" | sha256sum -c -
          echo "290a6f61f9e48f2e30becbf93da69a002e839742cbeb556d36bd409b8fbf3bec  $pages_dir/index.icon.png" | sha256sum -c -
          echo "33c94cb3175f3333b82e2a3be5e8e86f77986f0aa2042b1631f6367a4e5bb6ba  $pages_dir/index.js" | sha256sum -c -
          echo "c0167be478bcbc291bb752bb503d9f0ba527b64d93a62523ad915c9ad96b8d3f  $pages_dir/index.png" | sha256sum -c -
          echo "fc74679e3b97f76878947fcd4fbe1268cbfa6188182a2e33bbc3f5dc9bfa57d0  $pages_dir/index.wasm" | sha256sum -c -
          echo "a92a9931fee6f05ab2d315e7032ced52f9b8a29c89d50c309a41ff8d3dd0be35  $pages_dir/index.html" | sha256sum -c -
          echo "65a13e3af4a64ce247071cd2d5a75cb14e89bcc0664462753862e212a84549be  $pages_dir/index.pck" | sha256sum -c -
          test "$(stat -c %s "$pages_dir/index.pck")" -eq 96220476
          node --check "$pages_dir/index.js"

          cat "$GITHUB_WORKSPACE"/.github/dev-patch/prod-v0420-to-dev-v0420-dev7-final.xdelta.part* \
            > "$RUNNER_TEMP/prod-to-dev7.xdelta"
          echo "d7e6d905786f519997130e4c0959b36e121e7bac87bd9689f07972ca9db4396a  $RUNNER_TEMP/prod-to-dev7.xdelta" | sha256sum -c -
          test "$(stat -c %s "$RUNNER_TEMP/prod-to-dev7.xdelta")" -eq 9717787
          test "$(find "$GITHUB_WORKSPACE/.github/dev-patch" -maxdepth 1 -name 'prod-v0420-to-dev-v0420-dev7-final.xdelta.part*' -type f | wc -l)" -eq 39

          curl -L --fail --retry 4 --retry-all-errors \
            https://github.com/jmacd/xdelta/releases/download/v3.2.0/xdelta3-3.2.0-linux-x86_64.tar.gz \
            -o "$tool_dir/xdelta3.tar.gz"
          echo "480295c7a41fea6503659f19ddc61676c0df4834e2292846ba97de30c68c2397  $tool_dir/xdelta3.tar.gz" | sha256sum -c -
          tar --no-same-owner -xzf "$tool_dir/xdelta3.tar.gz" -C "$tool_dir"
          chmod +x "$tool_dir/xdelta3-3.2.0-linux-x86_64/xdelta3"
          xdelta="$tool_dir/xdelta3-3.2.0-linux-x86_64/xdelta3"

          "$xdelta" -d -s "$pages_dir/index.pck" \
            "$RUNNER_TEMP/prod-to-dev7.xdelta" "$RUNNER_TEMP/dev7-index.pck"
          echo "81d3e2f630fc54de00df87b1da5d98809b197725bb60c8087a55026306af2ca9  $RUNNER_TEMP/dev7-index.pck" | sha256sum -c -
          test "$(stat -c %s "$RUNNER_TEMP/dev7-index.pck")" -eq 105337792

          for file in \
            index.apple-touch-icon.png \
            index.audio.position.worklet.js \
            index.audio.worklet.js \
            index.icon.png \
            index.js \
            index.png \
            index.wasm
          do
            cp "$pages_dir/$file" "$dev_dir/$file"
          done

          case "$DEPLOY_VERSION" in
            mossvein_candidate)
              cat "$GITHUB_WORKSPACE"/.github/dev-patch/mossvein-first-cave.xdelta.part* \
                > "$RUNNER_TEMP/mossvein-first-cave.xdelta"
              echo "48d8f9156ab90883a3ab649367f90b5cceb520d6ca999e8a47fc6d09770ed4ef  $RUNNER_TEMP/mossvein-first-cave.xdelta" | sha256sum -c -
              test "$(stat -c %s "$RUNNER_TEMP/mossvein-first-cave.xdelta")" -eq 1153042
              test "$(find "$GITHUB_WORKSPACE/.github/dev-patch" -maxdepth 1 -name 'mossvein-first-cave.xdelta.part*' -type f | wc -l)" -eq 5
              echo "28b223a1fcc4cf4e3be54000f09faabd0ea193b50c9cc8d5aa0de6fa2d6ea84d  $GITHUB_WORKSPACE/.github/dev-patch/mossvein-corner-overlap-final.xdelta" | sha256sum -c -
              test "$(stat -c %s "$GITHUB_WORKSPACE/.github/dev-patch/mossvein-corner-overlap-final.xdelta")" -eq 99704
              "$xdelta" -d -s "$RUNNER_TEMP/dev7-index.pck" \
                "$RUNNER_TEMP/mossvein-first-cave.xdelta" "$RUNNER_TEMP/mossvein-candidate.pck"
              echo "a70dbab1d3cb66afdd36fa43a5d1d6840ccd428af337ad8add4996d8dbf8520b  $RUNNER_TEMP/mossvein-candidate.pck" | sha256sum -c -
              test "$(stat -c %s "$RUNNER_TEMP/mossvein-candidate.pck")" -eq 106383940
              "$xdelta" -d -s "$RUNNER_TEMP/mossvein-candidate.pck" \
                "$GITHUB_WORKSPACE/.github/dev-patch/mossvein-corner-overlap-final.xdelta" "$dev_dir/index.pck"
              sed 's/"index.pck":105337792/"index.pck":106384772/' \
                "$GITHUB_WORKSPACE/.github/dev-build/index.html" > "$dev_dir/index.html"
              echo "4955fb0e48467eac8a0dc000075e04673e2d45df41744b70af27f17902bcbbfc  $dev_dir/index.pck" | sha256sum -c -
              echo "4f8d616acd1d788047b5f22276515db94d3735ec3011c99523aa1dcf1be9b140  $dev_dir/index.html" | sha256sum -c -
              test "$(stat -c %s "$dev_dir/index.pck")" -eq 106384772
              ;;
            dev7_rollback)
              cp "$RUNNER_TEMP/dev7-index.pck" "$dev_dir/index.pck"
              cp "$GITHUB_WORKSPACE/.github/dev-build/index.html" "$dev_dir/index.html"
              echo "81d3e2f630fc54de00df87b1da5d98809b197725bb60c8087a55026306af2ca9  $dev_dir/index.pck" | sha256sum -c -
              echo "1d18a1d5cbfb02ef94c3606ff9620305f09968ad06dba08d5eb0d027e26b545b  $dev_dir/index.html" | sha256sum -c -
              test "$(stat -c %s "$dev_dir/index.pck")" -eq 105337792
              ;;
            *)
              echo "::error::Unknown DEV package: $DEPLOY_VERSION"
              exit 1
              ;;
          esac
          grep -q 'v0.42.0-dev.7' "$dev_dir/index.html"

          echo "a92a9931fee6f05ab2d315e7032ced52f9b8a29c89d50c309a41ff8d3dd0be35  $pages_dir/index.html" | sha256sum -c -
          echo "65a13e3af4a64ce247071cd2d5a75cb14e89bcc0664462753862e212a84549be  $pages_dir/index.pck" | sha256sum -c -
          test "$(find "$pages_dir" -maxdepth 1 -type f | wc -l)" -eq 9
          test "$(find "$dev_dir" -maxdepth 1 -type f | wc -l)" -eq 9

      - name: Upload combined production and Mossvein DEV package
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ runner.temp }}/ever-deeper-pages

      - name: Upload reusable Mossvein DEV package
        uses: actions/upload-artifact@v4
        with:
          name: ever-deeper-mossvein-first-cave-dev
          path: ${{ runner.temp }}/ever-deeper-pages/dev
          compression-level: 0
          retention-days: 14

  deploy-pages:
    needs: package
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy production plus Mossvein DEV preview
        id: deployment
        uses: actions/deploy-pages@v4

  verify-deployment:
    needs: deploy-pages
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DEPLOY_VERSION: ${{ github.event_name == 'workflow_dispatch' && inputs.dev_version || 'mossvein_candidate' }}
    steps:
      - name: Verify production stayed unchanged and DEV is playable candidate
        shell: bash
        run: |
          set -euo pipefail
          base_url="https://corpax88.github.io/Ever-Deeper"
          cache_key="$GITHUB_SHA-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-$DEPLOY_VERSION"

          for file in \
            index.apple-touch-icon.png \
            index.audio.position.worklet.js \
            index.audio.worklet.js \
            index.icon.png \
            index.js \
            index.png \
            index.wasm \
            index.html \
            index.pck
          do
            curl -L --fail --retry 12 --retry-delay 5 --retry-all-errors \
              "$base_url/$file?verify=$cache_key" -o "$RUNNER_TEMP/production-$file"
            curl -L --fail --retry 12 --retry-delay 5 --retry-all-errors \
              "$base_url/dev/$file?verify=$cache_key" -o "$RUNNER_TEMP/dev-$file"
          done

          for target in production dev
          do
            echo "27408d8b450ea9b0664fa639129e01dd79bdee7dfb494319cd06106d64e647d5  $RUNNER_TEMP/$target-index.apple-touch-icon.png" | sha256sum -c -
            echo "be33985bc7160d6bf9646f259cd86b259cd67b02ccb297ee5c44f8ac84327bc8  $RUNNER_TEMP/$target-index.audio.position.worklet.js" | sha256sum -c -
            echo "5b476a9c9ce642c0ee4256436d1bc31d9c38f868aca0f9a8e2a57c18d2dec2a3  $RUNNER_TEMP/$target-index.audio.worklet.js" | sha256sum -c -
            echo "290a6f61f9e48f2e30becbf93da69a002e839742cbeb556d36bd409b8fbf3bec  $RUNNER_TEMP/$target-index.icon.png" | sha256sum -c -
            echo "33c94cb3175f3333b82e2a3be5e8e86f77986f0aa2042b1631f6367a4e5bb6ba  $RUNNER_TEMP/$target-index.js" | sha256sum -c -
            echo "c0167be478bcbc291bb752bb503d9f0ba527b64d93a62523ad915c9ad96b8d3f  $RUNNER_TEMP/$target-index.png" | sha256sum -c -
            echo "fc74679e3b97f76878947fcd4fbe1268cbfa6188182a2e33bbc3f5dc9bfa57d0  $RUNNER_TEMP/$target-index.wasm" | sha256sum -c -
          done

          echo "a92a9931fee6f05ab2d315e7032ced52f9b8a29c89d50c309a41ff8d3dd0be35  $RUNNER_TEMP/production-index.html" | sha256sum -c -
          echo "65a13e3af4a64ce247071cd2d5a75cb14e89bcc0664462753862e212a84549be  $RUNNER_TEMP/production-index.pck" | sha256sum -c -

          case "$DEPLOY_VERSION" in
            mossvein_candidate)
              echo "4f8d616acd1d788047b5f22276515db94d3735ec3011c99523aa1dcf1be9b140  $RUNNER_TEMP/dev-index.html" | sha256sum -c -
              echo "4955fb0e48467eac8a0dc000075e04673e2d45df41744b70af27f17902bcbbfc  $RUNNER_TEMP/dev-index.pck" | sha256sum -c -
              test "$(stat -c %s "$RUNNER_TEMP/dev-index.pck")" -eq 106384772
              ;;
            dev7_rollback)
              echo "1d18a1d5cbfb02ef94c3606ff9620305f09968ad06dba08d5eb0d027e26b545b  $RUNNER_TEMP/dev-index.html" | sha256sum -c -
              echo "81d3e2f630fc54de00df87b1da5d98809b197725bb60c8087a55026306af2ca9  $RUNNER_TEMP/dev-index.pck" | sha256sum -c -
              test "$(stat -c %s "$RUNNER_TEMP/dev-index.pck")" -eq 105337792
              ;;
            *)
              exit 1
              ;;
          esac
