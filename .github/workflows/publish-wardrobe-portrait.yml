name: Publish reviewed wardrobe portrait to DEV and LIVE
on:
  push:
    branches: [main]
    paths: ['.github/workflows/publish-wardrobe-portrait.yml']
permissions:
  contents: read
  actions: read
  pages: write
  id-token: write
concurrency:
  group: pages-ever-deeper
  cancel-in-progress: false
jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Require successful checks of the inspected packages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test "$(gh api repos/Corpax88/Ever-Deeper/actions/runs/34324191544 --jq .conclusion)" = success
          test "$(gh api repos/Corpax88/Ever-Deeper/actions/runs/34324191544 --jq .head_sha)" = f3308054c60fd2014a6902038894f3a8a0cddce2
          test "$(gh api repos/Corpax88/Ever-Deeper/actions/runs/34324907471 --jq .conclusion)" = success
          test "$(gh api repos/Corpax88/Ever-Deeper/actions/runs/34324907471 --jq .head_sha)" = 7aff03a7843b9823396225136a37375385ee43ad
      - uses: actions/download-artifact@v4
        with:
          name: wardrobe-portrait-candidate
          run-id: 34324191544
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/candidate
      - name: Verify exact artifacts, preserve rollback and stage both builds
        run: python3 .github/wardrobe-portrait/publish.py prepare "$RUNNER_TEMP/candidate" "$RUNNER_TEMP/site" "$RUNNER_TEMP/rollback"
      - uses: actions/upload-artifact@v4
        with:
          name: ever-deeper-before-wardrobe-portrait-rollback
          path: ${{ runner.temp }}/rollback
          retention-days: 30
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ runner.temp }}/site
  deploy:
    needs: package
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
  verify:
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 .github/wardrobe-portrait/publish.py verify
