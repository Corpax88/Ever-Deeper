name: Publish reviewed DEV7 shared floor lighting
on:
  push:
    branches: [main]
    paths: ['.github/workflows/publish-dev-lighting.yml']
permissions:
  contents: read
  actions: read
  pages: write
  id-token: write
concurrency:
  group: pages-ever-deeper
  cancel-in-progress: false
jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Require the successful inspected package run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test "$(gh api repos/Corpax88/Ever-Deeper/actions/runs/34262864741 --jq .conclusion)" = success
          test "$(gh api repos/Corpax88/Ever-Deeper/actions/runs/34262864741 --jq .head_sha)" = 85b808bd2390a2fc81b66a503ab57f0a28eed50c
      - uses: actions/download-artifact@v4
        with:
          name: dev-lighting-candidate
          run-id: 34262864741
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/candidate
      - name: Preserve the previous release and stage reviewed files
        run: python3 .github/dev-lighting/publish.py prepare "$RUNNER_TEMP/candidate" "$RUNNER_TEMP/site" "$RUNNER_TEMP/rollback"
      - uses: actions/upload-artifact@v4
        with:
          name: ever-deeper-before-dev7-floor-rollback
          path: ${{ runner.temp }}/rollback
          retention-days: 30
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ runner.temp }}/site
  deploy:
    needs: package
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
  verify:
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 .github/dev-lighting/publish.py verify
