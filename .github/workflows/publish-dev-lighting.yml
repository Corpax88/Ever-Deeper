name: Publish reviewed DEV9 cached fixed lighting
on:
  push:
    branches: [main]
    paths: ['.github/workflows/publish-dev-lighting.yml']
permissions:
  contents: read
  actions: read
  pages: write
  id-token: write
concurrency:
  group: pages-ever-deeper
  cancel-in-progress: false
jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Require the successful inspected package run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test "$(gh api repos/Corpax88/Ever-Deeper/actions/runs/34281591200 --jq .conclusion)" = success
          test "$(gh api repos/Corpax88/Ever-Deeper/actions/runs/34281591200 --jq .head_sha)" = b6c0a4eca4d47f8134d12f58cd4a7b2607e25420
      - name: Require the successful exact-package lifecycle check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test "$(gh api repos/Corpax88/Ever-Deeper/actions/runs/34281929628 --jq .conclusion)" = success
          test "$(gh api repos/Corpax88/Ever-Deeper/actions/runs/34281929628 --jq .head_sha)" = 209df257c79c3d4d42d712e71eb576550545fa87
      - uses: actions/download-artifact@v4
        with:
          name: dev-lighting-candidate
          run-id: 34281591200
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/candidate
      - name: Preserve the previous release and stage reviewed files
        run: python3 .github/dev-lighting/publish.py prepare "$RUNNER_TEMP/candidate" "$RUNNER_TEMP/site" "$RUNNER_TEMP/rollback"
      - uses: actions/upload-artifact@v4
        with:
          name: ever-deeper-before-dev9-cache-rollback
          path: ${{ runner.temp }}/rollback
          retention-days: 30
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ runner.temp }}/site
  deploy:
    needs: package
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
  verify:
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 .github/dev-lighting/publish.py verify
