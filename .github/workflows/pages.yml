          echo "1466646e6c597561f9567d51920d7715d6609f201338d25b2d0df81878e6c468  $RUNNER_TEMP/v0.12-index.pck" | sha256sum -c -

          cat "$GITHUB_WORKSPACE"/.github/itch-patch/v0.12-to-v0.13-clean-hud.xdelta.part* \
