name: Deploy Godot iPhone landscape v0.14

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Reconstruct verified Godot iPhone build
        shell: bash
        run: |
          set -euo pipefail

          build_dir="$RUNNER_TEMP/ever-deeper-web"
          tool_dir="$RUNNER_TEMP/tools"
          base_url="https://html-classic.itch.zone/html/18924146"
          mkdir -p "$build_dir" "$tool_dir"

          for file in \
            index.apple-touch-icon.png \
            index.audio.position.worklet.js \
            index.audio.worklet.js \
            index.icon.png \
            index.js \
            index.png \
            index.wasm
          do
            curl -L --fail --retry 4 --retry-all-errors \
              "$base_url/$file" -o "$build_dir/$file"
          done

          echo "27408d8b450ea9b0664fa639129e01dd79bdee7dfb494319cd06106d64e647d5  $build_dir/index.apple-touch-icon.png" | sha256sum -c -
          echo "be33985bc7160d6bf9646f259cd86b259cd67b02ccb297ee5c44f8ac84327bc8  $build_dir/index.audio.position.worklet.js" | sha256sum -c -
          echo "5b476a9c9ce642c0ee4256436d1bc31d9c38f868aca0f9a8e2a57c18d2dec2a3  $build_dir/index.audio.worklet.js" | sha256sum -c -
          echo "290a6f61f9e48f2e30becbf93da69a002e839742cbeb556d36bd409b8fbf3bec  $build_dir/index.icon.png" | sha256sum -c -
          echo "33c94cb3175f3333b82e2a3be5e8e86f77986f0aa2042b1631f6367a4e5bb6ba  $build_dir/index.js" | sha256sum -c -
          echo "06d3678b294967a7d6a4ed93d783ae6d7f604f54bd952372010b05d85d3046d2  $build_dir/index.png" | sha256sum -c -
          echo "fc74679e3b97f76878947fcd4fbe1268cbfa6188182a2e33bbc3f5dc9bfa57d0  $build_dir/index.wasm" | sha256sum -c -

          curl -L --fail --retry 4 --retry-all-errors \
            "$base_url/index.pck" -o "$RUNNER_TEMP/live-index.pck"
          echo "cebdde9655d17cca69f891578f71f6f46b598c79c7022d28b9ee3d893a19c3b5  $RUNNER_TEMP/live-index.pck" | sha256sum -c -

          cat "$GITHUB_WORKSPACE"/.github/itch-patch/live-to-v0.10.xdelta.part* \
            > "$RUNNER_TEMP/live-to-v0.10.xdelta"
          echo "58abd171cffc9a785e1d4355f3eefb4ba262ab9c43b46f35f50aeb6fd2e42089  $RUNNER_TEMP/live-to-v0.10.xdelta" | sha256sum -c -

          cp "$GITHUB_WORKSPACE/.github/itch-patch/v0.10-to-v0.11-iphone.xdelta" \
            "$RUNNER_TEMP/v0.10-to-v0.11-iphone.xdelta"
          echo "74447d6ffca73aeaa71453a5cfcb01e9857afda72f7f187151101373d3e193c6  $RUNNER_TEMP/v0.10-to-v0.11-iphone.xdelta" | sha256sum -c -

          curl -L --fail --retry 4 --retry-all-errors \
            https://github.com/jmacd/xdelta/releases/download/v3.2.0/xdelta3-3.2.0-linux-x86_64.tar.gz \
            -o "$tool_dir/xdelta3.tar.gz"
          echo "480295c7a41fea6503659f19ddc61676c0df4834e2292846ba97de30c68c2397  $tool_dir/xdelta3.tar.gz" | sha256sum -c -
          tar --no-same-owner -xzf "$tool_dir/xdelta3.tar.gz" -C "$tool_dir"
          chmod +x "$tool_dir/xdelta3-3.2.0-linux-x86_64/xdelta3"

          "$tool_dir/xdelta3-3.2.0-linux-x86_64/xdelta3" -d \
            -s "$RUNNER_TEMP/live-index.pck" \
            "$RUNNER_TEMP/live-to-v0.10.xdelta" \
            "$RUNNER_TEMP/v0.10-index.pck"
          echo "f2d720655e2a8c3b711376e4d51db302edbc160e5a0f16cc99d03569a9f0ce6e  $RUNNER_TEMP/v0.10-index.pck" | sha256sum -c -

          "$tool_dir/xdelta3-3.2.0-linux-x86_64/xdelta3" -d \
            -s "$RUNNER_TEMP/v0.10-index.pck" \
            "$RUNNER_TEMP/v0.10-to-v0.11-iphone.xdelta" \
            "$RUNNER_TEMP/v0.11-index.pck"
          echo "c574622d304f771064991bff51e7daac0619e6f09133cef0e363d526696a1818  $RUNNER_TEMP/v0.11-index.pck" | sha256sum -c -

          cat "$GITHUB_WORKSPACE"/.github/itch-patch/v0.11-to-v0.12-iphone.xdelta.part* \
            > "$RUNNER_TEMP/v0.11-to-v0.12-iphone.xdelta"
          echo "65074e53debfe0ac00a121a4d38fccb0dbed42d582f2a820d5052156e1db5e90  $RUNNER_TEMP/v0.11-to-v0.12-iphone.xdelta" | sha256sum -c -

          "$tool_dir/xdelta3-3.2.0-linux-x86_64/xdelta3" -d \
            -s "$RUNNER_TEMP/v0.11-index.pck" \
            "$RUNNER_TEMP/v0.11-to-v0.12-iphone.xdelta" \
            "$RUNNER_TEMP/v0.12-index.pck"
          echo "1466646e6c597561f9567d51920d7715d6609f201338d25b2d0df81878e6c468  $RUNNER_TEMP/v0.12-index.pck" | sha256sum -c -

          cat "$GITHUB_WORKSPACE"/.github/itch-patch/v0.12-to-v0.13-clean-hud.xdelta.part* \
            > "$RUNNER_TEMP/v0.12-to-v0.13-clean-hud.xdelta"
          echo "676fd1cbe45fa07a043b4fce92d36a6bcda37495282cd755af2c3259cfddc42b  $RUNNER_TEMP/v0.12-to-v0.13-clean-hud.xdelta" | sha256sum -c -

          "$tool_dir/xdelta3-3.2.0-linux-x86_64/xdelta3" -d \
            -s "$RUNNER_TEMP/v0.12-index.pck" \
            "$RUNNER_TEMP/v0.12-to-v0.13-clean-hud.xdelta" \
            "$RUNNER_TEMP/v0.13-index.pck"
          echo "0f546b3cee288d9a3d036df140169e262ac3e1dd967b14dbf70e1d3172bea5fe  $RUNNER_TEMP/v0.13-index.pck" | sha256sum -c -

          cat "$GITHUB_WORKSPACE"/.github/itch-patch/v0.13-to-v0.14-transparency.xdelta.part* \
            > "$RUNNER_TEMP/v0.13-to-v0.14-transparency.xdelta"
          echo "ab611ab3db14799d645b76656e16e8cc6e108be78973d38f9208e7f3e56d5c98  $RUNNER_TEMP/v0.13-to-v0.14-transparency.xdelta" | sha256sum -c -

          "$tool_dir/xdelta3-3.2.0-linux-x86_64/xdelta3" -d \
            -s "$RUNNER_TEMP/v0.13-index.pck" \
            "$RUNNER_TEMP/v0.13-to-v0.14-transparency.xdelta" \
            "$build_dir/index.pck"
          cat "$GITHUB_WORKSPACE"/.github/itch-patch/index-landscape.png.part* \
            > "$build_dir/index.png"
          cp "$GITHUB_WORKSPACE/.github/itch-patch/index.html" "$build_dir/index.html"

          echo "47cfd4a6b4f18f87e8a2c881db3a51fe1cd03af0668059d7ec3f3d80ceec5caa  $build_dir/index.pck" | sha256sum -c -
          echo "ef39123a4df97f032814983cd6d8ee3531795fae4dbdbce37889df77873bdd1e  $build_dir/index.html" | sha256sum -c -
          echo "c0167be478bcbc291bb752bb503d9f0ba527b64d93a62523ad915c9ad96b8d3f  $build_dir/index.png" | sha256sum -c -
          test "$(find "$build_dir" -maxdepth 1 -type f | wc -l)" -eq 9

      - name: Upload GitHub Pages package
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ runner.temp }}/ever-deeper-web

      - name: Upload itch package
        uses: actions/upload-artifact@v4
        with:
          name: ever-deeper-itch-build
          path: ${{ runner.temp }}/ever-deeper-web
          compression-level: 0
          retention-days: 1

  deploy-pages:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  deploy-itch:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download itch package
        uses: actions/download-artifact@v4
        with:
          name: ever-deeper-itch-build
          path: ${{ runner.temp }}/ever-deeper-web

      - name: Install official itch.io Butler
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/butler"
          curl -L --fail --retry 4 --retry-all-errors \
            https://github.com/itchio/butler/releases/download/v15.30.0/butler-linux-amd64.zip \
            -o "$RUNNER_TEMP/butler.zip"
          echo "f2cae7d24eba0605048f71d0cc056f65c3b7ff9f73724f504c731cf3645bef08  $RUNNER_TEMP/butler.zip" | sha256sum -c -
          unzip -q "$RUNNER_TEMP/butler.zip" -d "$RUNNER_TEMP/butler"
          test -f "$RUNNER_TEMP/butler/linux-amd64/butler"
          chmod +x "$RUNNER_TEMP/butler/linux-amd64/butler"
          "$RUNNER_TEMP/butler/linux-amd64/butler" version

      - name: Publish transparency fix to itch.io
        shell: bash
        env:
          BUTLER_API_KEY: ${{ secrets.BUTLER_API_KEY }}
        run: |
          set -euo pipefail
          test -n "${BUTLER_API_KEY:-}"
          "$RUNNER_TEMP/butler/linux-amd64/butler" push \
            "$RUNNER_TEMP/ever-deeper-web" \
            corpax88/ever-deeper-playtest:html5 \
            --userversion 0.14.0-transparency-fix
