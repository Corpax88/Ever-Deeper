            > "$RUNNER_TEMP/v0.20-to-v0.21-road-world.xdelta"
          echo "07b38331669817fff2fe3ae34f4d5085da41cd17b5f46fdf41cccff2551ae3f3  $RUNNER_TEMP/v0.20-to-v0.21-road-world.xdelta" | sha256sum -c -

          "$tool_dir/xdelta3-3.2.0-linux-x86_64/xdelta3" -d \
