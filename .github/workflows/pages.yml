          echo "692a7e2c9bb77353b924f92f0241da364c6270dee8b54e11d4166d4de616c998  $RUNNER_TEMP/v0.21-index.pck" | sha256sum -c -

          cat "$GITHUB_WORKSPACE"/.github/itch-patch/v0.21-to-v0.22-pickup-light-paths.xdelta.part* \
