          echo "c259f9fb6bb91194cbbec7f0df7b6c5e36218ffd59c26a42f7ee1dda78dcfa58  $RUNNER_TEMP/v0.22-to-v0.23-color-text-soft-rails.xdelta" | sha256sum -c -

