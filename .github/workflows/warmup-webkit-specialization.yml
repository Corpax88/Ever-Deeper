name: Warmup candidate pre-navigation WebKit shader history
on:
  push:
    branches: [codex/nonindexed-warmup-webkit-20260917]
    paths: ['tools/warmup_webkit_specialization/REQUEST.json']
permissions:
  contents: read
  actions: read
concurrency:
  group: warmup-webkit-specialization-${{ github.ref }}
  cancel-in-progress: false
jobs:
  moving-deep:
    if: github.ref == 'refs/heads/codex/nonindexed-warmup-webkit-20260917'
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 2
          sparse-checkout: |
            tools/warmup_webkit_specialization
            .github/workflows
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify forwarding, restoration and unchanged observer
        run: |
          mkdir -p "$RUNNER_TEMP/warmup-webkit-specialization"
          python3 tools/warmup_webkit_specialization/prepare.py --output "$RUNNER_TEMP/warmup-webkit-specialization/source-binding.json"
          node tools/warmup_webkit_specialization/check.mjs > "$RUNNER_TEMP/warmup-webkit-specialization/observer-check.log" 2>&1
          node tools/warmup_webkit_specialization/check-resources.mjs > "$RUNNER_TEMP/warmup-webkit-specialization/resource-check.log" 2>&1
          node tools/warmup_webkit_specialization/check-identity.mjs > "$RUNNER_TEMP/warmup-webkit-specialization/identity-check.log" 2>&1
          node tools/warmup_webkit_specialization/check-pre-navigation.mjs > "$RUNNER_TEMP/warmup-webkit-specialization/pre-navigation-check.log" 2>&1
          node --check tools/warmup_webkit_specialization/run.mjs
          node --check tools/warmup_webkit_specialization/resources.js
      - uses: actions/download-artifact@v4
        with:
          name: premium-web-candidate-9d52cb37a0a7162f0950a93610fa5ce5a4489171
          run-id: '35253727925'
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/candidate
      - name: Verify all nine original exported files without rebuilding
        run: |
          python3 tools/warmup_webkit_specialization/prepare.py --candidate "$RUNNER_TEMP/candidate" --output "$RUNNER_TEMP/warmup-webkit-specialization/package-binding.json"
      - name: Install the established WebKit and UI reader
        run: |
          npm ci --ignore-scripts
          npx playwright install --with-deps webkit
          swiftc tools/warmup_webkit_specialization/ocr.swift -o "$RUNNER_TEMP/webkit-ocr"
          sw_vers > "$RUNNER_TEMP/warmup-webkit-specialization/macos-version.txt"
          system_profiler SPDisplaysDataType > "$RUNNER_TEMP/warmup-webkit-specialization/display.txt"
          cat node_modules/playwright-core/browsers.json > "$RUNNER_TEMP/warmup-webkit-specialization/playwright-browsers.json"
      - name: One real moving diagnostic session
        timeout-minutes: 6
        run: |
          node tools/warmup_webkit_specialization/run.mjs "$RUNNER_TEMP/candidate" "$RUNNER_TEMP/warmup-webkit-specialization" "$RUNNER_TEMP/webkit-ocr" > "$RUNNER_TEMP/warmup-webkit-specialization/runner.log" 2>&1
      - name: Hash closed evidence after exit
        if: always()
        run: |
          python3 - <<'PY'
          import hashlib,json,os
          from pathlib import Path
          root=Path(os.environ['RUNNER_TEMP'])/'warmup-webkit-specialization'
          root.mkdir(exist_ok=True)
          manifest={p.name:{'size':p.stat().st_size,'sha256':hashlib.sha256(p.read_bytes()).hexdigest()} for p in root.iterdir() if p.is_file() and p.name!='closed-manifest.json'}
          (root/'closed-manifest.json').write_text(json.dumps(manifest,indent=2)+'\n')
          if (root/'result.json').exists() and json.loads((root/'result.json').read_text()).get('complete'):
              assert (root/'runner.log').read_text().count('WARMUP_PRE_NAVIGATION_IDENTITY_COMPLETE ')==1
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: warmup-webkit-specialization-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/warmup-webkit-specialization
          if-no-files-found: error
          retention-days: 30
