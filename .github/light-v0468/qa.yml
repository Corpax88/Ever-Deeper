name: Light Lab validation
on:
  push:
    branches: [codex-light-v0468]
    paths: ['.github/workflows/qa-light-v0468.yml']
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 .github/light-v0468/prepare.py "$RUNNER_TEMP/candidate"
      - uses: actions/upload-artifact@v4
        with:
          name: light-exact-candidates
          path: ${{ runner.temp }}/candidate
  layout:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - uses: actions/download-artifact@v4
        with:
          name: light-exact-candidates
          path: ${{ runner.temp }}/candidate
      - run: |
          npm ci
          npx playwright install --with-deps webkit
      - run: TOUCH_BROWSER=webkit SMALL_IPHONE=1 CAPTURE_END=10 node .github/light-v0468/capture-style.mjs --web-dir "$RUNNER_TEMP/candidate/live" --output-dir "$RUNNER_TEMP/evidence"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: light-webkit-layouts
          path: ${{ runner.temp }}/evidence
  touch:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 12
    strategy:
      matrix:
        side: [live, dev]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - uses: actions/download-artifact@v4
        with:
          name: light-exact-candidates
          path: ${{ runner.temp }}/candidate
      - run: |
          npm ci
          npx playwright install --with-deps webkit
      - run: TOUCH_BROWSER=webkit SMALL_IPHONE=1 OVERHAUL_GAMEPLAY=1 MENU_TOUCH=1 node .github/light-v0468/capture-style.mjs --web-dir "$RUNNER_TEMP/candidate/${{ matrix.side }}" --output-dir "$RUNNER_TEMP/touch"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: light-touch-${{ matrix.side }}
          path: ${{ runner.temp }}/touch

