name: Retrieve World Scale Review
on:
  push:
    branches: [codex/world-scale-evidence-20261001]
permissions: {contents: read, actions: read}
jobs:
  compact:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          artifact-ids: 11148718680
          run-id: 36835005359
          github-token: '${{ github.token }}'
          path: evidence
      - run: |
          pip install Pillow
          python3 - <<'PY'
          from pathlib import Path
          from PIL import Image
          import shutil,json,hashlib
          root=Path('evidence');out=Path('review');out.mkdir();bindings={}
          for p in root.rglob('*'):
            if not p.is_file():continue
            rel=p.relative_to(root);dest=out/rel;dest.parent.mkdir(parents=True,exist_ok=True)
            if p.suffix=='.png':
              dest=dest.with_suffix('.jpg');Image.open(p).convert('RGB').save(dest,quality=95,subsampling=0)
              bindings[str(rel)]={'original_sha256':hashlib.sha256(p.read_bytes()).hexdigest(),'review_file':str(dest.relative_to(out)),'review_sha256':hashlib.sha256(dest.read_bytes()).hexdigest()}
            elif p.suffix not in ['.webm','.mp4']:shutil.copy2(p,dest)
          (out/'image-bindings.json').write_text(json.dumps(bindings,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: world-scale-review
          path: review
          retention-days: 30
